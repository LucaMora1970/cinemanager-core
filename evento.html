<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Evento — Cinema Multisala Teatro Mendrisio</title>
<meta name="description" content="Scheda di un evento speciale al Cinema Multisala Teatro di Mendrisio: data, sala, biglietteria e contatti.">

<link rel="icon" type="image/svg+xml" href="favicon.svg?v=20260826d">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png?v=20260826d">
<link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16.png?v=20260826d">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png?v=20260826d">

<style>
  :root{
    --black:#2c2d2d;--white:#f7f4ef;--orange:#f0801a;--muted:#aaa;
    --line:rgba(255,255,255,.14);--ease:cubic-bezier(.16,1,.3,1);
    --surf:#3a3b3b;--surf2:#242525;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  /* Stesso trucco di film.html: il fixed background resta uguale scorrendo
     tutta la pagina, invece di stirarsi dall'inizio alla fine del contenuto */
  html{background:#050505;}
  body{background:linear-gradient(120deg,#020202,#111 58%,#050505);background-attachment:fixed;color:var(--white);font-family:Arial,Helvetica,sans-serif;line-height:1.5;overflow-x:clip;}
  a{color:inherit;text-decoration:none;}

  header{display:flex;justify-content:space-between;align-items:center;padding:20px max(4vw,env(safe-area-inset-right)) 20px max(4vw,env(safe-area-inset-left));}
  .brand{display:flex;align-items:center;gap:13px;}
  .brand-symbol{width:46px;height:29px;flex-shrink:0;}
  .brand-symbol svg{display:block;width:100%;height:100%;}
  .brand-name{font-size:.62rem;line-height:1.3;letter-spacing:.12em;text-transform:uppercase;opacity:.85;}
  nav{display:flex;gap:22px;font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;}
  @media(max-width:700px){nav{display:none;}}

  .back-row{max-width:900px;margin:0 auto;padding:0 max(4vw,env(safe-area-inset-right)) 14px max(4vw,env(safe-area-inset-left));}
  .back-link{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--white);font-family:inherit;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:8px 14px;border-radius:30px;cursor:pointer;transition:background-color .2s var(--ease);}
  .back-link:hover{background:rgba(255,255,255,.12);}

  .hero{position:relative;width:100%;aspect-ratio:16/9;max-height:58vh;background:linear-gradient(135deg,var(--surf),var(--surf2));overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%;display:block;}
  .hero .no-poster{font-size:4rem;opacity:.5;}
  .hero .scrim{position:absolute;inset:0;background:linear-gradient(180deg,#050505 0%,rgba(0,0,0,0) 18%,rgba(0,0,0,.15) 52%,rgba(0,0,0,.55) 76%,#050505 100%);}
  .hero .hero-content{position:absolute;left:0;right:0;bottom:0;max-width:900px;margin:0 auto;padding:0 max(4vw,env(safe-area-inset-right)) 26px max(4vw,env(safe-area-inset-left));width:100%;}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:.66rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);margin-bottom:10px;}
  .hero .title{font-size:clamp(1.6rem,4.4vw,2.5rem);font-weight:800;text-wrap:balance;text-shadow:0 2px 8px rgba(0,0,0,.6);}
  .hero .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;font-size:.74rem;color:var(--muted);}
  .hero .meta span{background:rgba(255,255,255,.1);padding:5px 12px;border-radius:20px;}

  main{max-width:900px;margin:0 auto;padding:36px max(4vw,env(safe-area-inset-right)) 70px max(4vw,env(safe-area-inset-left));}
  .layout{display:grid;grid-template-columns:1fr;gap:32px;}
  @media(min-width:700px){.layout{grid-template-columns:1fr 260px;}}
  .main-col{order:2;}
  .side-col{order:1;}
  @media(min-width:700px){.main-col{order:1;}.side-col{order:2;}}

  h2.lbl{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--orange);margin:26px 0 12px;}
  h2.lbl:first-child{margin-top:0;}
  .desc{font-size:.92rem;color:#d9d5cd;line-height:1.65;white-space:pre-line;}

  .side-card{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:20px;}
  .side-row{display:flex;justify-content:space-between;gap:10px;font-size:.82rem;padding:10px 0;border-bottom:1px solid var(--line);}
  .side-row:last-of-type{border-bottom:0;}
  .side-row .k{color:var(--muted);flex-shrink:0;}
  .side-row .v{color:var(--white);font-weight:700;text-align:right;}
  .side-row .v a{color:var(--orange);text-decoration:none;border-bottom:1px solid rgba(240,128,26,.4);}

  .cta-btn{
    margin-top:16px;width:100%;display:flex;align-items:center;justify-content:center;gap:7px;
    background:var(--orange);color:#1b1006;font-size:.85rem;font-weight:800;letter-spacing:.03em;
    padding:13px 16px;border-radius:10px;transition:transform .2s var(--ease),box-shadow .2s var(--ease);
  }
  .cta-btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(240,128,26,.4);}

  .cta-contact{
    margin-top:16px;display:flex;align-items:center;gap:10px;background:transparent;
    border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:.82rem;color:var(--white);
  }
  .cta-contact .ic{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:1px solid var(--orange);color:var(--orange);display:flex;align-items:center;justify-content:center;}
  .cta-contact .ic svg{width:15px;height:15px;}

  .trailer-wrap{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--surf2);}
  .trailer-wrap iframe{width:100%;height:100%;border:0;display:block;}

  .loading,.empty-msg{text-align:center;color:var(--muted);padding:80px 20px;font-size:.88rem;}
  .spinner{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--orange);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media(prefers-reduced-motion:reduce){.spinner{animation:none;}}
</style>
</head>
<body>

  <header>
    <a href="index.html#home" class="brand" aria-label="Cinema Multisala Teatro">
      <span class="brand-symbol">
<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <g fill="#f0801a">
    <g transform="translate(74.50716800516875,21) scale(3.3418716090059726)"><g transform="translate(-14.117936,-45.200568)"><g transform="matrix(0.26507501,0,0,0.26507501,95.958061,68.307823)">
      <path d="M -69.953258,336.85183 -117.30623,-87.172521 c -174.34505,27.622568 -196.94533,186.542022 -190.48811,228.155241 14.70812,153.53843 158.56072,212.37091 237.841082,195.86911 z"/>
      <path d="M 88.248722,15.066857 A 79.639091,79.639091 0 0 1 9.0071038,94.704957 79.639091,79.639091 0 0 1 -71.025493,15.861794 79.639091,79.639091 0 0 1 7.4172505,-64.563307 79.639091,79.639091 0 0 1 88.232852,13.477063 Z"/>
      <path d="M 1.076204,266.89859 -21.52408,158.20199 362.68075,-43.04816 380.97621,331.47082 Z"/>
    </g></g></g>
  </g>
</svg>
</span>
      <span class="brand-name">Cinema Multisala Teatro<br>Mendrisio</span>
    </a>
    <nav aria-label="Navigazione principale">
      <a href="index.html#programma">Programma</a>
      <a href="index.html#proiezioni-speciali">Eventi speciali</a>
      <a href="index.html#contatti">Contatti</a>
    </nav>
  </header>

  <div class="back-row">
    <button type="button" class="back-link" onclick="if(history.length>1){history.back();}else{location.href='index.html#proiezioni-speciali';}">← Torna indietro</button>
  </div>

<div id="root">
  <div class="loading"><div class="spinner"></div>Caricamento in corso...</div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getFirestore,doc,getDoc}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const FB={apiKey:"AIzaSyCYM1tZsUI-pz3D0J6EWEMqyDxrk9hep1o",authDomain:"cinemanager-4c67c.firebaseapp.com",projectId:"cinemanager-4c67c",storageBucket:"cinemanager-4c67c.firebasestorage.app",messagingSenderId:"730874662111",appId:"1:730874662111:web:8a4a501dd81644bc96ed6a"};
const SALE={'1':'Teatro','2':'Ciak','3':'1908','4':'Mignon'};
// Cercata per nome dell'attività (scheda Google verificata), non per
// indirizzo testuale: un indirizzo grezzo può risolvere nel posto sbagliato
// (è successo con "Via Vincenzo Vela 21, Mendrisio", finito a Rancate)
const MAPS_URL='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('Cinema Multisala Teatro Mendrisio');
const DOW=['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
const MESI=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];

function esc(s){return(s||'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function dataCompleta(dataStr){
  const d=new Date(dataStr+'T12:00:00');
  return DOW[d.getDay()]+' '+d.getDate()+' '+MESI[d.getMonth()];
}
function dataBreve(dataStr){
  const d=new Date(dataStr+'T12:00:00');
  return DOW[d.getDay()].slice(0,3)+' '+d.getDate()+' '+MESI[d.getMonth()].slice(0,3);
}
// Contatto per prenotazioni: mostrato solo in assenza di un link
// biglietteria — stesso "fumetto" già usato per i contatti di Cine
// Uncinetto in index.html
const CHAT_SVG='<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M4 12a8 8 0 1 1 3.4 6.5L4 20l1.3-3.6A7.96 7.96 0 0 1 4 12Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>';

const app=initializeApp(FB);
const db=getFirestore(app);
const params=new URLSearchParams(location.search);
const evId=params.get('id');

async function init(){
  if(!evId){
    document.getElementById('root').innerHTML='<div class="empty-msg">⚠️ Evento non specificato.</div>';
    return;
  }
  let snap;
  try{
    snap=await getDoc(doc(db,'eventiSpeciali',evId));
  }catch(e){
    console.error(e);
    document.getElementById('root').innerHTML='<div class="empty-msg">⚠️ Impossibile caricare l\'evento. Riprova tra qualche minuto.</div>';
    return;
  }
  if(!snap.exists()||snap.data().attivo===false){
    document.getElementById('root').innerHTML='<div class="empty-msg">⚠️ Evento non trovato — potrebbe non essere più in programma.</div>';
    return;
  }
  const ev=snap.data();

  document.title=(ev.titolo||'Evento')+' — Cinema Multisala Teatro Mendrisio';
  const metaDesc=document.querySelector('meta[name="description"]');
  if(metaDesc&&ev.descrizione)metaDesc.setAttribute('content',ev.descrizione.slice(0,200));

  const salaNome=SALE[ev.sala]||ev.sala||'';
  const eyebrow=ev.organizzatore?('Evento pubblico organizzato da '+esc(ev.organizzatore)):esc(ev.badge||'Evento speciale');

  const ctaHtml=ev.link
    ?`<a class="cta-btn" href="${esc(ev.link)}" target="_blank" rel="noopener">Biglietti online</a>`
    :(ev.contatto?`<div class="cta-contact"><span class="ic">${CHAT_SVG}</span><span>${esc(ev.contatto)}</span></div>`:'');

  const descHtml=[ev.sottotitolo,ev.descrizione].filter(Boolean).map(esc).join('\n\n');

  document.getElementById('root').innerHTML=`
    <div class="hero">
      ${ev.immagine?`<img src="${esc(ev.immagine)}" alt="${esc(ev.titolo)}">`:'<span class="no-poster">🎬</span>'}
      <div class="scrim"></div>
      <div class="hero-content">
        <div class="eyebrow">${eyebrow}</div>
        <div class="title">${esc(ev.titolo)}</div>
        <div class="meta">${ev.data?`<span>${esc(dataCompleta(ev.data))}</span>`:''}${ev.ora?`<span>${esc(ev.ora)}</span>`:''}</div>
      </div>
    </div>
    <main>
      <div class="layout">
        <div class="main-col">
          ${descHtml?`<h2 class="lbl">La serata</h2><p class="desc">${descHtml}</p>`:''}
          ${ev.trailer?`<h2 class="lbl">Trailer</h2><div class="trailer-wrap"><iframe src="https://www.youtube.com/embed/${esc(ev.trailer)}" title="Trailer" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`:''}
        </div>
        <div class="side-col">
          <div class="side-card">
            ${ev.data?`<div class="side-row"><span class="k">Data</span><span class="v">${esc(dataBreve(ev.data))}</span></div>`:''}
            ${ev.ora?`<div class="side-row"><span class="k">Ora</span><span class="v">${esc(ev.ora)}</span></div>`:''}
            <div class="side-row"><span class="k">Dove</span><span class="v"><a href="${MAPS_URL}" target="_blank" rel="noopener">Via V. Vela 21, Mendrisio ↗</a></span></div>
            ${salaNome?`<div class="side-row"><span class="k">Sala</span><span class="v">${esc(salaNome)}</span></div>`:''}
            ${ctaHtml}
          </div>
        </div>
      </div>
    </main>`;
}

init();
</script>

</body>
</html>
