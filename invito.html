<style>
  :root{
    --bg:#f0801a;--ink:#1b1006;--ink2:rgba(27,16,6,.68);
    --cream:#f7f4ef;
    --panel:#241505;--panel-bdr:rgba(255,255,255,.1);--panel-ink:#f7ede0;--panel-ink2:rgba(247,237,224,.62);
    --chip-bg:#f0801a;--chip-ink:#1b1006;
    --dark-bar:#17171e;--dark-bar-bdr:rgba(255,255,255,.08);
    /* texture di sfondo: alterna a scacchiera il bicchiere di popcorn (ricreato in
       vettoriale) e il logo del cinema (stessi path dell'header), in nero al 4.5%
       di opacità sull'arancio — visibile ma non compete con i testi. In variabile
       così la si può riapplicare anche al pannello catturato per il download PNG. */
    --texture:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22220%22 height=%22220%22 viewBox=%220 0 220 220%22%3E%3Cg opacity=%220.045%22 fill=%22%23000%22%3E%3Cg transform=%22translate(14,10)%22%3E%3Ccircle cx=%2213.76%22 cy=%2213.76%22 r=%2211.18%22/%3E%3Ccircle cx=%2233.54%22 cy=%2213.76%22 r=%2211.18%22/%3E%3Ccircle cx=%2253.32%22 cy=%2213.76%22 r=%2211.18%22/%3E%3Ccircle cx=%2273.1%22 cy=%2213.76%22 r=%2211.18%22/%3E%3Ccircle cx=%221.72%22 cy=%2234.4%22 r=%2212.9%22/%3E%3Ccircle cx=%2222.36%22 cy=%2234.4%22 r=%2212.9%22/%3E%3Ccircle cx=%2243.0%22 cy=%2234.4%22 r=%2212.9%22/%3E%3Ccircle cx=%2263.64%22 cy=%2234.4%22 r=%2212.9%22/%3E%3Ccircle cx=%2284.28%22 cy=%2234.4%22 r=%2212.9%22/%3E%3Crect x=%2212.04%22 y=%2243.0%22 width=%2261.92%22 height=%228.6%22 rx=%224.3%22/%3E%3Cg fill=%22none%22 stroke=%22%23000%22 stroke-width=%225.16%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M15.48 47.3 H70.52 L60.2 86.0 H25.8 Z%22/%3E%3Cline x1=%2235.26%22 y1=%2249.88%22 x2=%2232.68%22 y2=%2283.42%22/%3E%3Cline x1=%2250.74%22 y1=%2249.88%22 x2=%2253.32%22 y2=%2283.42%22/%3E%3C/g%3E%3C/g%3E%3Cg transform=%22translate(128,14)%22%3E%3Cg transform=%22translate(-9.5106,-2.6809) scale(0.12766)%22%3E%3Cg transform=%22translate(74.50716800516875,21) scale(3.3418716090059726)%22%3E%3Cg transform=%22translate(-14.117936,-45.200568)%22%3E%3Cg transform=%22matrix(0.26507501,0,0,0.26507501,95.958061,68.307823)%22%3E%3Cpath d=%22M -69.953258,336.85183 -117.30623,-87.172521 c -174.34505,27.622568 -196.94533,186.542022 -190.48811,228.155241 14.70812,153.53843 158.56072,212.37091 237.841082,195.86911 z%22/%3E%3Cpath d=%22M 88.248722,15.066857 A 79.639091,79.639091 0 0 1 9.0071038,94.704957 79.639091,79.639091 0 0 1 -71.025493,15.861794 79.639091,79.639091 0 0 1 7.4172505,-64.563307 79.639091,79.639091 0 0 1 88.232852,13.477063 Z%22/%3E%3Cpath d=%22M 1.076204,266.89859 -21.52408,158.20199 362.68075,-43.04816 380.97621,331.47082 Z%22/%3E%3C/g%3E%3C/g%3E%3C/g%3E%3C/g%3E%3C/g%3E%3Cg transform=%22translate(14,120)%22%3E%3Cg transform=%22translate(-9.5106,-2.6809) scale(0.12766)%22%3E%3Cg transform=%22translate(74.50716800516875,21) scale(3.3418716090059726)%22%3E%3Cg transform=%22translate(-14.117936,-45.200568)%22%3E%3Cg transform=%22matrix(0.26507501,0,0,0.26507501,95.958061,68.307823)%22%3E%3Cpath d=%22M -69.953258,336.85183 -117.30623,-87.172521 c -174.34505,27.622568 -196.94533,186.542022 -190.48811,228.155241 14.70812,153.53843 158.56072,212.37091 237.841082,195.86911 z%22/%3E%3Cpath d=%22M 88.248722,15.066857 A 79.639091,79.639091 0 0 1 9.0071038,94.704957 79.639091,79.639091 0 0 1 -71.025493,15.861794 79.639091,79.639091 0 0 1 7.4172505,-64.563307 79.639091,79.639091 0 0 1 88.232852,13.477063 Z%22/%3E%3Cpath d=%22M 1.076204,266.89859 -21.52408,158.20199 362.68075,-43.04816 380.97621,331.47082 Z%22/%3E%3C/g%3E%3C/g%3E%3C/g%3E%3C/g%3E%3C/g%3E%3Cg transform=%22translate(124,124)%22%3E%3Ccircle cx=%2213.76%22 cy=%2213.76%22 r=%2211.18%22/%3E%3Ccircle cx=%2233.54%22 cy=%2213.76%22 r=%2211.18%22/%3E%3Ccircle cx=%2253.32%22 cy=%2213.76%22 r=%2211.18%22/%3E%3Ccircle cx=%2273.1%22 cy=%2213.76%22 r=%2211.18%22/%3E%3Ccircle cx=%221.72%22 cy=%2234.4%22 r=%2212.9%22/%3E%3Ccircle cx=%2222.36%22 cy=%2234.4%22 r=%2212.9%22/%3E%3Ccircle cx=%2243.0%22 cy=%2234.4%22 r=%2212.9%22/%3E%3Ccircle cx=%2263.64%22 cy=%2234.4%22 r=%2212.9%22/%3E%3Ccircle cx=%2284.28%22 cy=%2234.4%22 r=%2212.9%22/%3E%3Crect x=%2212.04%22 y=%2243.0%22 width=%2261.92%22 height=%228.6%22 rx=%224.3%22/%3E%3Cg fill=%22none%22 stroke=%22%23000%22 stroke-width=%225.16%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M15.48 47.3 H70.52 L60.2 86.0 H25.8 Z%22/%3E%3Cline x1=%2235.26%22 y1=%2249.88%22 x2=%2232.68%22 y2=%2283.42%22/%3E%3Cline x1=%2250.74%22 y1=%2249.88%22 x2=%2253.32%22 y2=%2283.42%22/%3E%3C/g%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background-color:var(--bg);
    background-image:var(--texture);
    background-repeat:repeat;background-size:220px 220px;
    color:var(--ink);line-height:1.5;
  }
  a{color:var(--ink);text-decoration:underline;}

  /* L'intestazione resta nello stile scuro del sito (coerenza di brand),
     il contenuto sotto è la vera "cartolina" arancione da condividere */
  header{background:var(--dark-bar);border-bottom:1px solid var(--dark-bar-bdr);padding:26px 20px;text-align:center;}
  header a{display:inline-flex;align-items:center;gap:10px;color:#f4f4f6;font-weight:800;font-size:15px;text-decoration:none;}
  header svg{width:26px;height:auto;flex:none;}

  main{max-width:600px;margin:0 auto;padding:32px 20px 50px;}

  .kind{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);opacity:.72;margin-bottom:8px;}
  .h1{font-size:clamp(32px,9vw,48px);font-weight:800;color:var(--ink);text-wrap:balance;line-height:1.05;margin-bottom:8px;}
  .sub{font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--ink2);margin-bottom:26px;}
  .state-msg{text-align:center;padding:60px 20px;color:var(--ink);font-size:14px;}

  .hero{position:relative;width:100%;aspect-ratio:4/3;max-height:320px;border-radius:16px;overflow:hidden;margin-bottom:22px;box-shadow:0 10px 30px rgba(27,16,6,.25);}
  .hero img{width:100%;height:100%;object-fit:cover;object-position:center center;}

  .intro{font-size:16px;font-weight:600;line-height:1.6;margin-bottom:24px;color:var(--ink);}

  .box{background:var(--panel);border:1px solid var(--panel-bdr);border-radius:14px;padding:20px 22px;margin-bottom:16px;box-shadow:0 8px 24px rgba(0,0,0,.28);}
  .box .lbl{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--chip-bg);margin-bottom:14px;}
  .box p{font-size:17px;line-height:1.6;color:var(--panel-ink);}
  .box a{color:var(--panel-ink);font-weight:700;}
  .maps-link{display:inline-block;font-size:13px;font-weight:700;color:var(--panel-ink2)!important;}

  /* box orario: sfondo arancione, scritta nera — sostituisce la vecchia "ore xx:xx" testuale */
  .time-chip{display:inline-block;background:var(--chip-bg);color:var(--chip-ink);padding:4px 10px;border-radius:6px;font-weight:800;font-size:17px;}

  /* elenco Quando/Dove: colonna etichette larga quanto la più lunga, valori tutti allineati e uniformi */
  .qlist{display:grid;grid-template-columns:max-content 1fr;column-gap:18px;row-gap:14px;align-items:center;}
  .qrow{display:contents;}
  .qk{grid-column:1;font-size:14px;font-weight:700;color:var(--panel-ink2);white-space:nowrap;}
  .qv{grid-column:2;font-size:17px;font-weight:700;color:var(--panel-ink);min-width:0;overflow-wrap:break-word;}
  .qv.cap{text-transform:uppercase;letter-spacing:.01em;}

  .rsvp{display:flex;flex-direction:column;gap:10px;margin:26px 0 8px;}
  .rsvp a{
    text-align:center;text-decoration:none;
    font-family:inherit;font-size:15px;font-weight:800;
    padding:15px 16px;border-radius:10px;
    border:2px solid var(--ink);
    transition:opacity .15s;
  }
  .rsvp a:hover{opacity:.85;}
  .rsvp-yes{background:var(--ink);color:var(--cream);}
  .rsvp-no{background:none;color:var(--ink);}
  .rsvp-note{font-size:13px;font-weight:600;color:var(--ink2);text-align:center;margin-top:14px;}

  .privacy-note{font-size:12px;color:var(--ink2);text-align:center;margin-top:26px;line-height:1.5;}

  .share-actions{display:flex;gap:10px;margin-top:22px;}
  .share-actions button{
    flex:1;appearance:none;font-family:inherit;cursor:pointer;
    background:none;border:1.5px solid var(--ink2);color:var(--ink);
    font-size:13px;font-weight:700;padding:11px 10px;border-radius:9px;
    transition:opacity .15s;
  }
  .share-actions button:hover{opacity:.7;}
  .share-actions button:disabled{opacity:.5;cursor:default;}

  /* usati solo durante la cattura per il download PNG: sfondo pieno (non trasparente
     come nel main normale) e riga di brand di chiusura, rimossi subito dopo */
  .capture-bg{background-color:var(--bg);background-image:var(--texture);background-repeat:repeat;background-size:220px 220px;}
  .capture-brand{text-align:center;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-top:30px;padding-top:18px;border-top:1px solid rgba(27,16,6,.15);}

  @media print{
    header,.share-actions,.rsvp,.rsvp-note,.privacy-note{display:none!important;}
    body{background:var(--bg);}
    main{max-width:100%;}
    .box{box-shadow:none;}
  }

  @media (max-width:380px){
    main{padding:26px 16px 44px;}
    .box{padding:16px;}
  }
</style>

    Cinema Multisala Teatro
  </a>
</header>

<main>
  <div id="card">
    <p class="state-msg" id="loading">Caricamento…</p>
  </div>
</main>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getFirestore,doc,getDoc}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const FB={apiKey:"AIzaSyCYM1tZsUI-pz3D0J6EWEMqyDxrk9hep1o",authDomain:"cinemanager-4c67c.firebaseapp.com",projectId:"cinemanager-4c67c",storageBucket:"cinemanager-4c67c.firebasestorage.app",messagingSenderId:"730874662111",appId:"1:730874662111:web:8a4a501dd81644bc96ed6a"};
const app=initializeApp(FB);
const db=getFirestore(app);

function esc(s){return(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function render(r,backdrop){
  const card=document.getElementById('card');

  if(r.tipo!=='compleanno'||!['accettata','programmata'].includes(r.stato)){
    card.innerHTML='<p class="state-msg">Questo invito non è (ancora) disponibile.</p>';
    return;
  }

  const nomeFest=r.nomeFesteggiato||'il festeggiato';
  const eta=r.etaFesteggiato?`${esc(String(r.etaFesteggiato))} anni`:'';
  const dataFmt=r.dataRichiesta
    ?new Date(r.dataRichiesta+'T00:00:00').toLocaleDateString('it-IT',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})
    :'';
  const quando=r.spettacoloScelto||r.fasciaOraria||'';

  const heroHtml=backdrop?`<div class="hero"><img src="${esc(backdrop)}" alt=""></div>`:'';

  const qrow=(k,v,cls)=>v?`<div class="qrow"><span class="qk">${esc(k)}</span><span class="qv${cls?' '+cls:''}">${v}</span></div>`:'';
  const quandoRows=[
    qrow('Data',esc(dataFmt),'cap'),
    qrow('Film',esc(quando)),
    qrow('Inizio evento',r.foyerOraArrivo?`<span class="time-chip">${esc(r.foyerOraArrivo)}</span>`:''),
    qrow('Fine compleanno',r.foyerOraDisponibileFino?`<span class="time-chip">${esc(r.foyerOraDisponibileFino)}</span>`:''),
  ].join('');
  const quandoBox=quandoRows?`<div class="box"><div class="lbl">Quando</div><div class="qlist">${quandoRows}</div></div>`:'';

  // Link diretto alla scheda Google Maps del cinema (place id) invece di una
  // ricerca testuale sull'indirizzo: quest'ultima risolveva erroneamente su
  // Rancate invece che sulla sede reale a Mendrisio.
  const mapsLink='https://www.google.com/maps/place/Cinema+Multisala+Teatro,+Mignon+e+Ciak/@45.872209,8.986201,17z/data=!3m1!4b1!4m5!3m4!1s0x478429cb29b04c87:0xcefd008b798701e3!8m2!3d45.872209!4d8.986201';
  const doveRows=[
    qrow('Luogo','Cinema Multisala Teatro'),
    qrow('Indirizzo','Via Vincenzo Vela 21, 6850 Mendrisio'),
    qrow('Mappa',`<a class="maps-link" href="${esc(mapsLink)}" target="_blank" rel="noopener">Apri in Google Maps →</a>`),
  ].join('');
  const doveBox=`<div class="box"><div class="lbl">Dove</div><div class="qlist">${doveRows}</div></div>`;

  const org=r.nome||'';
  const dataForMail=dataFmt?(' il '+dataFmt):'';
  const subjSi=`Conferma presenza – Compleanno di ${nomeFest}`;
  const bodySi=`Ciao${org?' '+org:''},\n\nConfermo la mia presenza al compleanno di ${nomeFest}${dataForMail}!\n\nNome: \nSiamo in (quante persone): \n\nA presto!`;
  const subjNo=`Compleanno di ${nomeFest} – Non potrò esserci`;
  const bodyNo=`Ciao${org?' '+org:''},\n\nPurtroppo non riuscirò a essere presente al compleanno di ${nomeFest}${dataForMail}. Grazie per l'invito!\n\nNome: `;
  const mailtoSi='mailto:'+encodeURIComponent(r.email||'')+'?subject='+encodeURIComponent(subjSi)+'&body='+encodeURIComponent(bodySi);
  const mailtoNo='mailto:'+encodeURIComponent(r.email||'')+'?subject='+encodeURIComponent(subjNo)+'&body='+encodeURIComponent(bodyNo);

  card.innerHTML=`
    <div class="kind">Invito al compleanno di</div>
    <div class="h1">${esc(nomeFest)}</div>
    ${eta?`<div class="sub">${eta}</div>`:''}
    ${heroHtml}
    <p class="intro">Ciao! Sei invitato a festeggiare con noi al cinema.</p>
    ${quandoBox}
    ${doveBox}
    <div class="rsvp">
      <a class="rsvp-yes" href="${mailtoSi}">Confermo la presenza</a>
      <a class="rsvp-no" href="${mailtoNo}">Non posso venire</a>
    </div>
    <p class="rsvp-note">Il bottone apre la tua app email, già pronta: basta scrivere il tuo nome e inviare${org?' a '+esc(org):''}.</p>
    <p class="privacy-note">Non raccogliamo né conserviamo il tuo indirizzo email: la risposta va direttamente all'organizzatore.</p>
    <div class="share-actions">
      <button type="button" id="btnDownloadPng">Scarica immagine (PNG)</button>
      <button type="button" id="btnPrint">Stampa / Salva PDF</button>
    </div>
  `;

  currentNomeFest=nomeFest;
  document.getElementById('btnDownloadPng').addEventListener('click', downloadInvitoPng);
  document.getElementById('btnPrint').addEventListener('click', ()=>window.print());
}

let currentNomeFest='invito';

function slugify(s){
  return (s||'invito').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')||'invito';
}

function loadHtml2Canvas(){
  if(window.html2canvas)return Promise.resolve();
  return new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    s.onload=()=>resolve();
    s.onerror=()=>reject(new Error('load-failed'));
    document.head.appendChild(s);
  });
}

// Genera un PNG della sola "cartolina" (senza i bottoni di conferma presenza,
// pensata da allegare a WhatsApp/email): nasconde temporaneamente le sezioni
// legate alla risposta via mailto, applica lo sfondo pieno con texture e una
// riga di brand di chiusura solo per la cattura, poi ripristina tutto.
async function downloadInvitoPng(){
  const btn=document.getElementById('btnDownloadPng');
  const main=document.querySelector('main');
  // .hero è escluso: le immagini dei film (TMDB e non solo) non inviano
  // intestazioni CORS, quindi il canvas non riesce a leggerle e resterebbe
  // comunque un buco vuoto — meglio ometterla che lasciarla a metà. Nella
  // stampa/PDF invece la foto resta, perché lì il browser la disegna
  // direttamente senza passare dal canvas.
  const toHide=['.hero','.rsvp','.rsvp-note','.privacy-note','.share-actions']
    .map(sel=>document.querySelector(sel)).filter(Boolean);
  const prevDisplay=toHide.map(el=>el.style.display);
  const prevBtnText=btn.textContent;

  btn.disabled=true;btn.textContent='Genero immagine…';
  toHide.forEach(el=>el.style.display='none');
  main.classList.add('capture-bg');
  const brand=document.createElement('div');
  brand.className='capture-brand';
  brand.textContent='Cinema Multisala Teatro — Mendrisio';
  main.appendChild(brand);

  try{
    await loadHtml2Canvas();
    const canvas=await window.html2canvas(main,{backgroundColor:'#f0801a',scale:2,useCORS:true});
    await new Promise((resolve,reject)=>{
      canvas.toBlob(blob=>{
        if(!blob){reject(new Error('blob-null'));return;}
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a');
        a.href=url;a.download='invito-'+slugify(currentNomeFest)+'.png';
        document.body.appendChild(a);a.click();a.remove();
        setTimeout(()=>URL.revokeObjectURL(url),4000);
        resolve();
      },'image/png');
    });
  }catch(e){
    alert("Non è stato possibile generare l'immagine. Riprova tra poco.");
  }finally{
    brand.remove();
    main.classList.remove('capture-bg');
    toHide.forEach((el,i)=>el.style.display=prevDisplay[i]);
    btn.disabled=false;btn.textContent=prevBtnText;
  }
}

async function init(){
  const id=new URLSearchParams(location.search).get('id');
  const card=document.getElementById('card');
  if(!id){
    card.innerHTML='<p class="state-msg">Link non valido.</p>';
    return;
  }
  try{
    const snap=await getDoc(doc(db,'richiesteEventi',id));
    if(!snap.exists()){
      card.innerHTML='<p class="state-msg">Invito non trovato. Controlla il link ricevuto.</p>';
      return;
    }
    const r=snap.data();
    let backdrop='';
    if(r.filmId){
      try{
        const filmSnap=await getDoc(doc(db,'films',r.filmId));
        if(filmSnap.exists()){
          const f=filmSnap.data();
          backdrop=f.backdrop||f.poster||'';
        }
      }catch(e){/* niente sfondo, il resto della pagina funziona comunque */}
    }
    render(r,backdrop);
  }catch(e){
    card.innerHTML='<p class="state-msg">Impossibile caricare l\'invito al momento. Riprova tra poco.</p>';
  }
}
init();
</script>

</body>
</html>
