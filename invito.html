<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sei invitato! — Cinema Multisala Teatro Mendrisio</title>
<meta name="description" content="Invito a un compleanno al Cinema Multisala Teatro Mendrisio">
<meta name="robots" content="noindex">

<link rel="icon" type="image/svg+xml" href="favicon.svg?v=20260826c">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png?v=20260826c">
<link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16.png?v=20260826c">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png?v=20260826c">

<style>
  :root{
    --bg:#0b0b0f;--surf:#17171e;--surf2:#1e1e27;
    --txt:#f4f4f6;--txt2:#9797a3;--bdr:rgba(255,255,255,.08);
    --acc:#f0801a;--grn:#4ae87a;--red:#e86a4a;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--txt);line-height:1.5;}
  a{color:var(--acc);text-decoration:none;}

  header{background:var(--surf);border-bottom:1px solid var(--bdr);padding:26px 20px;text-align:center;}
  header a{display:inline-flex;align-items:center;gap:10px;color:var(--txt);font-weight:800;font-size:15px;}
  header svg{width:26px;height:auto;flex:none;}

  main{max-width:640px;margin:0 auto;padding:40px 20px 60px;}

  .card{background:var(--surf);border:1px solid var(--bdr);border-radius:16px;padding:28px 26px;}
  .kind{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin-bottom:6px;}
  .h1{font-size:22px;font-weight:800;margin-bottom:4px;}
  .sub{font-size:14px;color:var(--txt2);}
  .state-msg{text-align:center;padding:60px 20px;color:var(--txt2);font-size:14px;}

  .hero{position:relative;margin:-28px -26px 24px;width:calc(100% + 52px);aspect-ratio:16/9;max-height:300px;border-radius:16px 16px 0 0;overflow:hidden;background:linear-gradient(135deg,#242430,#161620);}
  .hero img{width:100%;height:100%;object-fit:cover;object-position:center center;}
  .hero .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,15,.1) 0%,rgba(11,11,15,.45) 55%,var(--surf) 100%);}
  .hero-content{position:absolute;left:0;right:0;bottom:0;padding:20px 24px;}
  .hero-kind{font-size:15px;font-weight:800;letter-spacing:.04em;color:var(--acc);text-shadow:0 2px 6px rgba(0,0,0,.6);margin-bottom:6px;}
  .hero-title{font-size:clamp(24px,5vw,34px);font-weight:800;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.65);}
  .hero-sub{font-size:14px;color:rgba(255,255,255,.88);margin-top:6px;text-shadow:0 1px 5px rgba(0,0,0,.6);}

  .intro{font-size:15px;line-height:1.6;margin-bottom:22px;}

  .box{background:var(--surf2);border-radius:10px;padding:16px 18px;margin-bottom:18px;}
  .box .lbl{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--txt2);margin-bottom:6px;}
  .box p{font-size:15px;line-height:1.55;}
  .time-hl{color:var(--acc);font-weight:700;}

  .rsvp{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0 6px;}
  .rsvp a{
    flex:1;min-width:150px;text-align:center;
    font-family:inherit;font-size:14px;font-weight:700;
    padding:13px 16px;border-radius:8px;
    border:1px solid var(--bdr);
    transition:opacity .15s;
  }
  .rsvp a:hover{opacity:.88;}
  .rsvp-yes{background:var(--acc);border-color:var(--acc)!important;color:#1b1006;}
  .rsvp-no{background:none;color:var(--red);}
  .rsvp-note{font-size:12.5px;color:var(--txt2);text-align:center;margin-top:12px;}

  .privacy-note{font-size:12px;color:var(--txt2);text-align:center;margin-top:22px;line-height:1.5;}
</style>
</head>
<body>

<header>
  <a href="index.html">
    <svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g fill="#f0801a"><g transform="translate(74.50716800516875,21) scale(3.3418716090059726)"><g transform="translate(-14.117936,-45.200568)"><g transform="matrix(0.26507501,0,0,0.26507501,95.958061,68.307823)"><path d="M -69.953258,336.85183 -117.30623,-87.172521 c -174.34505,27.622568 -196.94533,186.542022 -190.48811,228.155241 14.70812,153.53843 158.56072,212.37091 237.841082,195.86911 z"/><path d="M 88.248722,15.066857 A 79.639091,79.639091 0 0 1 9.0071038,94.704957 79.639091,79.639091 0 0 1 -71.025493,15.861794 79.639091,79.639091 0 0 1 7.4172505,-64.563307 79.639091,79.639091 0 0 1 88.232852,13.477063 Z"/><path d="M 1.076204,266.89859 -21.52408,158.20199 362.68075,-43.04816 380.97621,331.47082 Z"/></g></g></g></g></svg>
    Cinema Multisala Teatro
  </a>
</header>

<main>
  <div class="card" id="card">
    <p class="state-msg" id="loading">Caricamento…</p>
  </div>
</main>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getFirestore,doc,getDoc}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const FB={apiKey:"AIzaSyCYM1tZsUI-pz3D0J6EWEMqyDxrk9hep1o",authDomain:"cinemanager-4c67c.firebaseapp.com",projectId:"cinemanager-4c67c",storageBucket:"cinemanager-4c67c.firebasestorage.app",messagingSenderId:"730874662111",appId:"1:730874662111:web:8a4a501dd81644bc96ed6a"};
const app=initializeApp(FB);
const db=getFirestore(app);

function esc(s){return(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function render(r,backdrop){
  const card=document.getElementById('card');

  if(r.tipo!=='compleanno'||!['accettata','programmata'].includes(r.stato)){
    card.innerHTML='<p class="state-msg">Questo invito non è (ancora) disponibile.</p>';
    return;
  }

  const nomeFest=r.nomeFesteggiato||'il festeggiato';
  const eta=r.etaFesteggiato?`${esc(String(r.etaFesteggiato))} anni · `:'';
  const dataFmt=r.dataRichiesta
    ?new Date(r.dataRichiesta+'T00:00:00').toLocaleDateString('it-IT',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})
    :'';
  const quando=r.spettacoloScelto||r.fasciaOraria||'';

  const heroHtml=backdrop?`
    <div class="hero">
      <img src="${esc(backdrop)}" alt="">
      <div class="scrim"></div>
      <div class="hero-content">
        <div class="hero-kind">🎂 Sei invitato!</div>
        <div class="hero-title">${esc(nomeFest)}</div>
        <div class="hero-sub">${eta}Compleanno al cinema</div>
      </div>
    </div>`:'';
  const headHtml=backdrop?'':`
    <div class="kind">🎂 Sei invitato!</div>
    <div class="h1">${esc(nomeFest)}</div>
    <div class="sub">${eta}Compleanno al cinema</div>`;

  let quandoBox='';
  if(dataFmt||quando){
    quandoBox=`<div class="box"><div class="lbl">Quando</div><p>`
      +(dataFmt?esc(dataFmt):'')
      +(quando?(dataFmt?' — ':'')+esc(quando):'')
      +(r.foyerOraArrivo?`<br>Vi aspettiamo in foyer alle <span class="time-hl">${esc(r.foyerOraArrivo)}</span>.`:'')
      +`</p></div>`;
  }

  const doveBox=`<div class="box"><div class="lbl">Dove</div><p>Cinema Multisala Teatro — Mendrisio</p></div>`;

  const org=r.nome||'';
  const dataForMail=dataFmt?(' il '+dataFmt):'';
  const subjSi=`Conferma presenza – Compleanno di ${nomeFest}`;
  const bodySi=`Ciao${org?' '+org:''},\n\nConfermo la mia presenza al compleanno di ${nomeFest}${dataForMail}!\n\nNome: \nSiamo in (quante persone): \n\nA presto!`;
  const subjNo=`Compleanno di ${nomeFest} – Non potrò esserci`;
  const bodyNo=`Ciao${org?' '+org:''},\n\nPurtroppo non riuscirò a essere presente al compleanno di ${nomeFest}${dataForMail}. Grazie per l'invito!\n\nNome: `;
  const mailtoSi='mailto:'+encodeURIComponent(r.email||'')+'?subject='+encodeURIComponent(subjSi)+'&body='+encodeURIComponent(bodySi);
  const mailtoNo='mailto:'+encodeURIComponent(r.email||'')+'?subject='+encodeURIComponent(subjNo)+'&body='+encodeURIComponent(bodyNo);

  card.innerHTML=`
    ${heroHtml}
    ${headHtml}
    <p class="intro" style="margin-top:${backdrop?'0':'20px'}">Ciao! Sei invitato a festeggiare con noi al cinema 🎉</p>
    ${quandoBox}
    ${doveBox}
    <div class="rsvp">
      <a class="rsvp-yes" href="${mailtoSi}">✅ Confermo la presenza</a>
      <a class="rsvp-no" href="${mailtoNo}">❌ Non posso venire</a>
    </div>
    <p class="rsvp-note">Il bottone apre la tua app email, già pronta: basta scrivere il tuo nome e inviare${org?' a '+esc(org):''}.</p>
    <p class="privacy-note">Non raccogliamo né conserviamo il tuo indirizzo email: la risposta va direttamente all'organizzatore.</p>
  `;
}

async function init(){
  const id=new URLSearchParams(location.search).get('id');
  const card=document.getElementById('card');
  if(!id){
    card.innerHTML='<p class="state-msg">Link non valido.</p>';
    return;
  }
  try{
    const snap=await getDoc(doc(db,'richiesteEventi',id));
    if(!snap.exists()){
      card.innerHTML='<p class="state-msg">Invito non trovato. Controlla il link ricevuto.</p>';
      return;
    }
    const r=snap.data();
    let backdrop='';
    if(r.filmId){
      try{
        const filmSnap=await getDoc(doc(db,'films',r.filmId));
        if(filmSnap.exists()){
          const f=filmSnap.data();
          backdrop=f.backdrop||f.poster||'';
        }
      }catch(e){/* niente sfondo, il resto della pagina funziona comunque */}
    }
    render(r,backdrop);
  }catch(e){
    card.innerHTML='<p class="state-msg">Impossibile caricare l\'invito al momento. Riprova tra poco.</p>';
  }
}
init();
</script>

</body>
</html>
