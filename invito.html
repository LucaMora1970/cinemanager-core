<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sei invitato! — Cinema Multisala Teatro Mendrisio</title>
<meta name="description" content="Invito a un compleanno al Cinema Multisala Teatro Mendrisio">
<meta name="robots" content="noindex">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<link rel="icon" type="image/svg+xml" href="favicon.svg?v=20260826c">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png?v=20260826c">
<link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16.png?v=20260826c">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png?v=20260826c">

<style>
  :root{
    --bg:#f0801a;--ink:#1b1006;--ink2:rgba(27,16,6,.68);
    --cream:#f7f4ef;--panel:rgba(255,255,255,.92);--panel-bdr:rgba(27,16,6,.12);
    --dark-bar:#17171e;--dark-bar-bdr:rgba(255,255,255,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;}
  a{color:var(--ink);text-decoration:underline;}

  /* L'intestazione resta nello stile scuro del sito (coerenza di brand),
     il contenuto sotto è la vera "cartolina" arancione da condividere */
  header{background:var(--dark-bar);border-bottom:1px solid var(--dark-bar-bdr);padding:26px 20px;text-align:center;}
  header a{display:inline-flex;align-items:center;gap:10px;color:#f4f4f6;font-weight:800;font-size:15px;text-decoration:none;}
  header svg{width:26px;height:auto;flex:none;}

  main{max-width:600px;margin:0 auto;padding:32px 20px 50px;}

  .kind{font-size:14px;font-weight:800;letter-spacing:.04em;color:var(--ink);opacity:.75;margin-bottom:6px;}
  .h1{font-size:clamp(28px,7vw,40px);font-weight:800;color:var(--ink);text-wrap:balance;margin-bottom:4px;}
  .sub{font-size:15px;font-weight:600;color:var(--ink2);}
  .state-msg{text-align:center;padding:60px 20px;color:var(--ink);font-size:14px;}

  .hero{position:relative;width:100%;aspect-ratio:4/3;max-height:320px;border-radius:16px;overflow:hidden;margin-bottom:20px;box-shadow:0 10px 30px rgba(27,16,6,.25);}
  .hero img{width:100%;height:100%;object-fit:cover;object-position:center center;}

  .intro{font-size:16px;font-weight:600;line-height:1.6;margin-bottom:24px;color:var(--ink);}

  .box{background:var(--panel);border:1px solid var(--panel-bdr);border-radius:14px;padding:18px 20px;margin-bottom:16px;box-shadow:0 4px 16px rgba(27,16,6,.08);}
  .box .lbl{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-bottom:8px;}
  .box p{font-size:15.5px;line-height:1.6;color:var(--ink);}
  .box a{color:var(--ink);font-weight:700;}
  .time-hl{color:var(--bg);background:var(--ink);padding:1px 6px;border-radius:5px;font-weight:800;font-style:normal;}

  .rsvp{display:flex;flex-direction:column;gap:10px;margin:26px 0 8px;}
  .rsvp a{
    text-align:center;text-decoration:none;
    font-family:inherit;font-size:15px;font-weight:800;
    padding:15px 16px;border-radius:10px;
    border:2px solid var(--ink);
    transition:opacity .15s;
  }
  .rsvp a:hover{opacity:.85;}
  .rsvp-yes{background:var(--ink);color:var(--cream);}
  .rsvp-no{background:none;color:var(--ink);}
  .rsvp-note{font-size:13px;font-weight:600;color:var(--ink2);text-align:center;margin-top:14px;}

  .privacy-note{font-size:12px;color:var(--ink2);text-align:center;margin-top:26px;line-height:1.5;}

  @media (max-width:380px){
    main{padding:26px 16px 44px;}
    .box{padding:16px;}
  }
</style>
</head>
<body>

<header>
  <a href="index.html">
    <svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g fill="#f0801a"><g transform="translate(74.50716800516875,21) scale(3.3418716090059726)"><g transform="translate(-14.117936,-45.200568)"><g transform="matrix(0.26507501,0,0,0.26507501,95.958061,68.307823)"><path d="M -69.953258,336.85183 -117.30623,-87.172521 c -174.34505,27.622568 -196.94533,186.542022 -190.48811,228.155241 14.70812,153.53843 158.56072,212.37091 237.841082,195.86911 z"/><path d="M 88.248722,15.066857 A 79.639091,79.639091 0 0 1 9.0071038,94.704957 79.639091,79.639091 0 0 1 -71.025493,15.861794 79.639091,79.639091 0 0 1 7.4172505,-64.563307 79.639091,79.639091 0 0 1 88.232852,13.477063 Z"/><path d="M 1.076204,266.89859 -21.52408,158.20199 362.68075,-43.04816 380.97621,331.47082 Z"/></g></g></g></g></svg>
    Cinema Multisala Teatro
  </a>
</header>

<main>
  <div id="card">
    <p class="state-msg" id="loading">Caricamento…</p>
  </div>
</main>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getFirestore,doc,getDoc}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const FB={apiKey:"AIzaSyCYM1tZsUI-pz3D0J6EWEMqyDxrk9hep1o",authDomain:"cinemanager-4c67c.firebaseapp.com",projectId:"cinemanager-4c67c",storageBucket:"cinemanager-4c67c.firebasestorage.app",messagingSenderId:"730874662111",appId:"1:730874662111:web:8a4a501dd81644bc96ed6a"};
const app=initializeApp(FB);
const db=getFirestore(app);

function esc(s){return(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function render(r,backdrop){
  const card=document.getElementById('card');

  if(r.tipo!=='compleanno'||!['accettata','programmata'].includes(r.stato)){
    card.innerHTML='<p class="state-msg">Questo invito non è (ancora) disponibile.</p>';
    return;
  }

  const nomeFest=r.nomeFesteggiato||'il festeggiato';
  const eta=r.etaFesteggiato?`${esc(String(r.etaFesteggiato))} anni`:'';
  const dataFmt=r.dataRichiesta
    ?new Date(r.dataRichiesta+'T00:00:00').toLocaleDateString('it-IT',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})
    :'';
  const quando=r.spettacoloScelto||r.fasciaOraria||'';

  const heroHtml=backdrop?`<div class="hero"><img src="${esc(backdrop)}" alt=""></div>`:'';

  const quandoLines=[];
  if(dataFmt)quandoLines.push(esc(dataFmt));
  if(quando)quandoLines.push('🎬 '+esc(quando));
  if(r.foyerOraArrivo)quandoLines.push(`Ritrovo nel foyer ore <span class="time-hl">${esc(r.foyerOraArrivo)}</span>`);
  if(r.foyerOraDisponibileFino)quandoLines.push(`Fine del compleanno ore <span class="time-hl">${esc(r.foyerOraDisponibileFino)}</span>`);
  const quandoBox=quandoLines.length?`<div class="box"><div class="lbl">Quando</div><p>${quandoLines.join('<br>')}</p></div>`:'';

  const address='Via Vincenzo Vela 21, 6850 Mendrisio';
  const mapsLink='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(address);
  const doveBox=`<div class="box"><div class="lbl">📍 Dove</div><p>Cinema Multisala Teatro<br>Mendrisio<br><a href="${esc(mapsLink)}" target="_blank" rel="noopener">Apri in Google Maps →</a></p></div>`;

  const org=r.nome||'';
  const dataForMail=dataFmt?(' il '+dataFmt):'';
  const subjSi=`Conferma presenza – Compleanno di ${nomeFest}`;
  const bodySi=`Ciao${org?' '+org:''},\n\nConfermo la mia presenza al compleanno di ${nomeFest}${dataForMail}!\n\nNome: \nSiamo in (quante persone): \n\nA presto!`;
  const subjNo=`Compleanno di ${nomeFest} – Non potrò esserci`;
  const bodyNo=`Ciao${org?' '+org:''},\n\nPurtroppo non riuscirò a essere presente al compleanno di ${nomeFest}${dataForMail}. Grazie per l'invito!\n\nNome: `;
  const mailtoSi='mailto:'+encodeURIComponent(r.email||'')+'?subject='+encodeURIComponent(subjSi)+'&body='+encodeURIComponent(bodySi);
  const mailtoNo='mailto:'+encodeURIComponent(r.email||'')+'?subject='+encodeURIComponent(subjNo)+'&body='+encodeURIComponent(bodyNo);

  card.innerHTML=`
    ${heroHtml}
    <div class="kind">🎂 Invito al compleanno di</div>
    <div class="h1">${esc(nomeFest)}</div>
    <div class="sub">${eta}</div>
    <p class="intro">Ciao! Sei invitato a festeggiare con noi al cinema 🎉</p>
    ${quandoBox}
    ${doveBox}
    <div class="rsvp">
      <a class="rsvp-yes" href="${mailtoSi}">Confermo la presenza</a>
      <a class="rsvp-no" href="${mailtoNo}">Non posso venire</a>
    </div>
    <p class="rsvp-note">Il bottone apre la tua app email, già pronta: basta scrivere il tuo nome e inviare${org?' a '+esc(org):''}.</p>
    <p class="privacy-note">Non raccogliamo né conserviamo il tuo indirizzo email: la risposta va direttamente all'organizzatore.</p>
  `;
}

async function init(){
  const id=new URLSearchParams(location.search).get('id');
  const card=document.getElementById('card');
  if(!id){
    card.innerHTML='<p class="state-msg">Link non valido.</p>';
    return;
  }
  try{
    const snap=await getDoc(doc(db,'richiesteEventi',id));
    if(!snap.exists()){
      card.innerHTML='<p class="state-msg">Invito non trovato. Controlla il link ricevuto.</p>';
      return;
    }
    const r=snap.data();
    let backdrop='';
    if(r.filmId){
      try{
        const filmSnap=await getDoc(doc(db,'films',r.filmId));
        if(filmSnap.exists()){
          const f=filmSnap.data();
          backdrop=f.backdrop||f.poster||'';
        }
      }catch(e){/* niente sfondo, il resto della pagina funziona comunque */}
    }
    render(r,backdrop);
  }catch(e){
    card.innerHTML='<p class="state-msg">Impossibile caricare l\'invito al momento. Riprova tra poco.</p>';
  }
}
init();
</script>

</body>
</html>
