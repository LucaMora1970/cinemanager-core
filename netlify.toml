[build]
  functions = "netlify/functions"
  publish = "."

[build.environment]
  # La Firebase Web API key non è un segreto: identifica solo il progetto,
  # la sicurezza reale è nelle regole Firestore. È volutamente pubblica in
  # decine di pagine del sito — senza questo lo scanner blocca ogni deploy
  # scambiandola per una credenziale sensibile
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyCYM1tZsUI-pz3D0J6EWEMqyDxrk9hep1o"
