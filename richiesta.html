<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stato richiesta — Cinema Multisala Teatro Mendrisio</title>
<meta name="description" content="Segui lo stato della tua richiesta al Cinema Multisala Teatro Mendrisio">
<meta name="robots" content="noindex">

<link rel="icon" type="image/svg+xml" href="favicon.svg?v=20260826c">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png?v=20260826c">
<link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16.png?v=20260826c">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png?v=20260826c">

<style>
  :root{
    --bg:#0b0b0f;--surf:#17171e;--surf2:#1e1e27;
    --txt:#f4f4f6;--txt2:#9797a3;--bdr:rgba(255,255,255,.08);
    --acc:#f0801a;--grn:#4ae87a;--red:#e86a4a;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--txt);line-height:1.5;}
  a{color:var(--acc);text-decoration:none;}

  header{background:var(--surf);border-bottom:1px solid var(--bdr);padding:26px 20px;text-align:center;}
  header a{display:inline-flex;align-items:center;gap:10px;color:var(--txt);font-weight:800;font-size:15px;}
  header svg{width:26px;height:auto;flex:none;}

  main{max-width:640px;margin:0 auto;padding:40px 20px 60px;}

  .card{background:var(--surf);border:1px solid var(--bdr);border-radius:16px;padding:28px 26px;}
  .card-head{display:flex;gap:16px;align-items:flex-start;margin-bottom:28px;}
  .poster{width:74px;height:106px;object-fit:cover;border-radius:8px;flex:none;background:var(--surf2);}
  .kind{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin-bottom:6px;}
  .h1{font-size:22px;font-weight:800;margin-bottom:4px;}
  .sub{font-size:14px;color:var(--txt2);}
  .state-note{font-size:14.5px;font-style:italic;color:var(--txt2);text-align:center;margin-top:14px;margin-bottom:20px;line-height:1.5;}
  .time-hl{color:var(--acc);font-weight:700;font-style:normal;}

  /* Sfondo con la locandina/backdrop del film, come nella scheda film —
     solo per i compleanni con un film reale collegato */
  .card .hero{position:relative;margin:-28px -26px 24px;width:calc(100% + 52px);aspect-ratio:16/9;max-height:300px;border-radius:16px 16px 0 0;overflow:hidden;background:linear-gradient(135deg,#242430,#161620);}
  .hero img{width:100%;height:100%;object-fit:cover;object-position:center center;}
  .hero .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,15,.1) 0%,rgba(11,11,15,.45) 55%,var(--surf) 100%);}
  .hero-content{position:absolute;left:0;right:0;bottom:0;padding:20px 24px;}
  .hero-kind{font-size:15px;font-weight:800;letter-spacing:.04em;color:var(--acc);text-shadow:0 2px 6px rgba(0,0,0,.6);margin-bottom:6px;}
  .hero-title{font-size:clamp(24px,5vw,34px);font-weight:800;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.65);}
  .hero-sub{font-size:14px;color:rgba(255,255,255,.88);margin-top:6px;text-shadow:0 1px 5px rgba(0,0,0,.6);}

  /* Timeline stato */
  .timeline{display:flex;justify-content:space-between;gap:6px;margin-bottom:28px;}
  .tl-step{flex:1;text-align:center;position:relative;}
  .tl-dot{width:14px;height:14px;border-radius:50%;background:var(--surf2);border:2px solid var(--bdr);margin:0 auto 8px;}
  .tl-step.done .tl-dot{background:var(--acc);border-color:var(--acc);}
  .tl-step.now .tl-dot{background:var(--acc);border-color:var(--acc);box-shadow:0 0 0 4px rgba(240,128,26,.25);}
  .tl-bar{position:absolute;top:6px;left:-50%;width:100%;height:2px;background:var(--bdr);z-index:-1;}
  .tl-step:first-child .tl-bar{display:none;}
  .tl-step.done .tl-bar,.tl-step.now .tl-bar{background:var(--acc);}
  .tl-label{font-size:10px;letter-spacing:.03em;color:var(--txt2);}
  .tl-step.done .tl-label,.tl-step.now .tl-label{color:var(--txt);}
  .timeline.rifiutata .tl-dot{background:var(--red)!important;border-color:var(--red)!important;box-shadow:none!important;}
  .timeline.rifiutata .tl-bar{background:var(--red)!important;}

  .box{background:var(--surf2);border-radius:10px;padding:16px 18px;margin-bottom:18px;}
  .box .lbl{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--txt2);margin-bottom:6px;}
  .box .lbl-acc{color:var(--acc);}
  .box p{font-size:15px;line-height:1.55;white-space:pre-wrap;}

  /* Box "La tua richiesta": due colonne (etichetta/valore) come nel recap in
     fondo, ma entrambe allineate a sinistra invece che valore a destra */
  .req-list{display:flex;flex-direction:column;}
  .req-row{display:flex;justify-content:space-between;gap:16px;padding:8px 0;font-size:14px;border-bottom:1px solid var(--bdr);}
  .req-row:last-child{border-bottom:0;}
  .req-k{color:var(--txt2);text-align:left;}
  .req-v{text-align:left;font-weight:600;color:var(--txt);}
  .req-v-total{font-size:17px;color:var(--acc);}

  .recap{border-top:1px solid var(--bdr);padding-top:18px;margin-top:6px;}
  .recap-row{display:flex;justify-content:space-between;gap:16px;padding:8px 0;font-size:14px;border-bottom:1px solid var(--bdr);}
  .recap-row:last-child{border-bottom:0;}
  .recap-row .k{color:var(--txt2);}
  .recap-row .v{text-align:right;max-width:60%;}

  .contact{margin-top:28px;font-size:13.5px;color:var(--txt2);text-align:center;}

  .state-msg{text-align:center;padding:60px 20px;color:var(--txt2);font-size:14px;}

  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px;padding-top:20px;border-top:1px solid var(--bdr);}
  .actions button,.actions a,.invite-actions button,.invite-actions a{
    display:inline-flex;align-items:center;gap:7px;
    background:var(--surf2);border:1px solid var(--bdr);color:var(--txt);
    font-family:inherit;font-size:12.5px;font-weight:600;
    padding:9px 16px;border-radius:8px;cursor:pointer;text-decoration:none;
    transition:border-color .15s,color .15s;
  }
  .actions button:hover,.actions a:hover,.invite-actions button:hover,.invite-actions a:hover{border-color:var(--acc);color:var(--acc);}
  .invite-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;}

  .response-actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0;}
  .response-actions button{
    flex:1;min-width:140px;
    font-family:inherit;font-size:13.5px;font-weight:700;
    padding:12px 16px;border-radius:8px;cursor:pointer;
    border:1px solid var(--bdr);
    transition:opacity .15s,border-color .15s;
  }
  .response-actions button:hover{opacity:.88;}
  .btn-confirm{background:var(--acc);border-color:var(--acc)!important;color:#1b1006;}
  .btn-cancel{background:none;color:var(--red);}
  .btn-cancel:hover{border-color:var(--red)!important;}

  @media print{
    body{background:#fff;color:#111;}
    header,.actions,.contact{display:none!important;}
    main{padding:0;max-width:100%;}
    .card{border:1px solid #ccc;background:#fff;}
    .sub,.tl-label,.recap-row .k{color:#555;}
    .box{background:#f4f4f4;}
  }
</style>
</head>
<body>

<header>
  <a href="index.html">

    Cinema Multisala Teatro
  </a>
</header>

<main>
  <div class="card" id="card">
    <p class="state-msg" id="loading">Caricamento…</p>
  </div>
  <p class="contact">Domande? Scrivici a <a href="mailto:info@fabbricadeisogni.ch">info@fabbricadeisogni.ch</a></p>
</main>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getFirestore,doc,getDoc,updateDoc}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const FB={apiKey:"AIzaSyCYM1tZsUI-pz3D0J6EWEMqyDxrk9hep1o",authDomain:"cinemanager-4c67c.firebaseapp.com",projectId:"cinemanager-4c67c",storageBucket:"cinemanager-4c67c.firebasestorage.app",messagingSenderId:"730874662111",appId:"1:730874662111:web:8a4a501dd81644bc96ed6a"};
const app=initializeApp(FB);
const db=getFirestore(app);

function esc(s){return(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

const TIPO_LABEL={'compleanno':'Compleanno al cinema','sala-privata':'Sala privata','aziendale':'Evento aziendale'};

// Etichette leggibili per i campi del recap — solo quelli che possono comparire,
// il resto (tipo/stato/timestamp/proposta) è gestito a parte
const FIELD_LABEL={
  nome:'Nome organizzatore',
  telefono:'Telefono',
  dataOraDesiderata:'Data e orario desiderato',
  dataRichiesta:'Data desiderata',
  spettacoloScelto:'Spettacolo scelto',
  numPersone:'Numero di persone',
  filmDesiderato:'Film desiderato',
  filmPreferenza:'Film preferiti',
  nomeFesteggiato:'Nome del festeggiato',
  etaFesteggiato:'Età del festeggiato',
  salaBarRichiesta:'Sala Bar (scambio regali)',
  dataPreferita:'Data preferita',
  fasciaOraria:'Fascia oraria preferita',
  numOspiti:'Numero di ospiti',
  tipoEvento:'Tipo di evento',
  dataOra:'Data e orario desiderato',
  numPartecipanti:'Numero di partecipanti',
  esigenzeTecniche:'Esigenze tecniche',
  azienda:'Azienda / Referente',
  note:'Note'
};
const FIELD_VALUE_LABEL={salaBarRichiesta:{si:'Richiesta'}};
const SKIP_FIELDS=new Set(['tipo','email','stato','proposta','createdAt','updatedAt','bookingId','posterUrl','filmId','foyerOraArrivo','foyerOraFineFilm','foyerOraDisponibileFino','showStart','sala']);
// Ordine fisso per i campi principali di un compleanno — "Spettacolo scelto"
// e "Fascia oraria preferita" sono alternativi (solo uno dei due è mai
// valorizzato, a seconda che ci fosse già una programmazione reale)
const COMPLEANNO_ORDER=['nome','telefono','dataRichiesta','spettacoloScelto','fasciaOraria','numPersone'];

// Messaggio breve per orientare il cliente in ogni fase — la proposta
// (quando presente) compare già per esteso nel box dedicato, qui basta
// dire "guarda sopra"
const STATE_NOTE={
  nuova:'La tua richiesta è in fase di valutazione: ti risponderemo il prima possibile.',
  proposta_inviata:'Trovi la proposta dello staff qui sopra. Confermala con un click, oppure scrivici se vuoi discuterne.',
  accettata:'Richiesta accettata! A breve la integriamo in programmazione e ricevi conferma definitiva.',
  programmata:'Tutto confermato e programmato — ti aspettiamo!',
  rifiutata:'Non siamo riusciti ad accogliere questa richiesta per le date indicate. Scrivici per valutare un\'alternativa.'
};

const STEPS=[
  {key:'nuova',label:'Ricevuta'},
  {key:'proposta_inviata',label:'Proposta inviata'},
  {key:'accettata',label:'Accettata'},
  {key:'programmata',label:'Confermata'}
];

let _currentId=null;
let _currentData=null;
let _currentBackdrop='';
let _currentFilmTitle='';
let _csSettings=null;

// Per i compleanni il prezzo è puro calcolo (nessuna trattativa), quindi lo
// mostriamo subito appena arriva la richiesta invece di aspettare che lo
// staff scriva una proposta — stessa formula di richiestaInviaProposta() in
// js/app.js (gestione.html), qui riscritta per non dipendere da quel file
function buildAutoProposta(r,cs){
  cs=cs||{};
  const price=cs.pricePerPerson!=null?cs.pricePerPerson:18.50;
  const minP=cs.minParticipants!=null?cs.minParticipants:8;
  const n=parseInt(r.numPersone)||0;
  const quando=r.spettacoloScelto||r.dataRichiesta||'';
  const righe=[];
  righe.push('Confermiamo la disponibilità'+(quando?' per '+quando:'')+'. I posti sono stati riservati per il vostro gruppo.');
  if(n>0){
    const festeggiatoGratis=n>=minP;
    const paganti=festeggiatoGratis?Math.max(n-1,0):n;
    righe.push('Costo totale stimato: CHF '+(paganti*price).toFixed(2)+' ('+paganti+' person'+(paganti===1?'a':'e')+' pagant'+(paganti===1?'e':'i')+' × CHF '+price.toFixed(2)+'/persona'+(festeggiatoGratis?', festeggiato gratis':'')+').');
  }
  righe.push('L\'importo verrà conguagliato alla cassa il giorno stesso, in base al numero effettivo di partecipanti.');
  if(r.salaBarRichiesta){
    const supp=cs.salaBarSupplement!=null?cs.salaBarSupplement:80;
    righe.push('Sala Bar per lo scambio regali confermata (supplemento CHF '+supp+'.-).');
  }
  return righe.join('\n\n');
}

// Stessi dati di buildAutoProposta(), ma come righe etichettate invece che
// come testo narrativo — solo per l'anteprima "La tua richiesta" prima
// della conferma; il testo salvato su Firestore resta quello discorsivo
function renderAutoRichiestaRows(r,cs,filmTitle){
  cs=cs||{};
  const price=cs.pricePerPerson!=null?cs.pricePerPerson:18.50;
  const minP=cs.minParticipants!=null?cs.minParticipants:8;
  const supp=cs.salaBarSupplement!=null?cs.salaBarSupplement:80;
  const n=parseInt(r.numPersone)||0;
  const festeggiatoGratis=n>=minP&&n>0;
  const paganti=festeggiatoGratis?Math.max(n-1,0):n;
  const costo=paganti*price;
  const totale=costo+(r.salaBarRichiesta?supp:0);
  const chf=v=>'CHF '+v.toFixed(2);
  const row=(k,v,cls)=>v?`<div class="req-row"><span class="req-k">${esc(k)}</span><span class="req-v${cls?' '+cls:''}">${esc(v)}</span></div>`:'';
  let rows='';
  rows+=row('Film',filmTitle||r.filmPreferenza||'');
  rows+=row('Data',r.dataRichiesta?new Date(r.dataRichiesta+'T00:00:00').toLocaleDateString('it-IT',{day:'2-digit',month:'long',year:'numeric'}):'');
  rows+=row('Ore',r.showStart||r.fasciaOraria||'');
  if(n>0)rows+=row('Nr. Persone',String(n));
  if(n>0)rows+=row('Costo',chf(costo)+(festeggiatoGratis?' (festeggiato gratis)':''));
  if(r.salaBarRichiesta)rows+=row('Sala Bar',chf(supp));
  if(n>0)rows+=row('Totale preventivo',chf(totale),'req-v-total');
  rows+=row('Nome organizzatore',r.nome||'');
  rows+=row('Telefono',r.telefono||'');
  return `<div class="box"><div class="lbl lbl-acc">La tua richiesta</div><div class="req-list">${rows}</div>`
    +`<p style="margin-top:12px;font-size:13px;color:var(--txt2)">L'importo verrà conguagliato alla cassa il giorno stesso, in base al numero effettivo di partecipanti.</p></div>`;
}

window.rispondiProposta=async function(scelta){
  if(!_currentId||!_currentData)return;
  const label=scelta==='accettata'?'confermare la proposta':'annullare questa richiesta';
  if(!confirm(`Vuoi ${label}?`))return;
  const btns=document.querySelectorAll('.response-actions button');
  btns.forEach(b=>b.disabled=true);
  const payload={stato:scelta,updatedAt:new Date().toISOString()};
  // Se non c'è ancora una proposta scritta dallo staff (preventivo
  // automatico mostrato direttamente da "nuova"), la registriamo così
  // com'è stata mostrata al cliente, per averne traccia in gestione
  if(!_currentData.proposta&&_currentData.tipo==='compleanno'&&_currentData.stato==='nuova'){
    payload.proposta=buildAutoProposta(_currentData,_csSettings);
  }
  try{
    await updateDoc(doc(db,'richiesteEventi',_currentId),payload);
    _currentData=Object.assign({},_currentData,payload);
    render(_currentData);
  }catch(e){
    alert('Non è stato possibile registrare la risposta. Riprova, oppure scrivici a info@fabbricadeisogni.ch.');
    btns.forEach(b=>b.disabled=false);
  }
};

function render(r){
  const card=document.getElementById('card');
  const stato=r.stato||'nuova';
  const isRifiutata=stato==='rifiutata';
  let stepIdx=STEPS.findIndex(s=>s.key===stato);
  if(stepIdx<0)stepIdx=isRifiutata?0:0;

  let timelineHtml='';
  if(isRifiutata){
    timelineHtml=`<div class="timeline rifiutata">
      <div class="tl-step done"><div class="tl-bar"></div><div class="tl-dot"></div><div class="tl-label">Ricevuta</div></div>
      <div class="tl-step now"><div class="tl-bar"></div><div class="tl-dot"></div><div class="tl-label">Non accettata</div></div>
    </div>`;
  } else {
    timelineHtml='<div class="timeline">'+STEPS.map((s,i)=>{
      const cls=i<stepIdx?'done':(i===stepIdx?'now':'');
      return `<div class="tl-step ${cls}"><div class="tl-bar"></div><div class="tl-dot"></div><div class="tl-label">${esc(s.label)}</div></div>`;
    }).join('')+'</div>';
  }

  const isCompleanno=r.tipo==='compleanno';
  // Preventivo automatico: solo compleanni ancora "nuova" senza una proposta
  // già scritta dallo staff, e solo se sappiamo almeno in quanti sono
  const autoEstimate=(isCompleanno&&stato==='nuova'&&!r.proposta&&(parseInt(r.numPersone)||0)>0)
    ?buildAutoProposta(r,_csSettings):'';
  const propostaBox=r.proposta
    ?`<div class="box"><div class="lbl">Proposta dallo staff</div><p>${esc(r.proposta)}</p></div>`
    :(autoEstimate?renderAutoRichiestaRows(r,_csSettings,_currentFilmTitle):'');
  // Per i compleanni, nome/età festeggiato vanno nell'intestazione (non nel
  // recap) e "nome" (l'organizzatore) scende nel recap con etichetta dedicata;
  // per gli altri tipi il comportamento resta quello di sempre (nome in testa)
  const headerSkip=isCompleanno?new Set(['nomeFesteggiato','etaFesteggiato']):new Set(['nome']);
  const allSkip=new Set([...SKIP_FIELDS,...headerSkip]);

  function recapRow(k){
    if(allSkip.has(k)||!FIELD_LABEL[k]||!r[k])return'';
    const vLabel=(FIELD_VALUE_LABEL[k]&&FIELD_VALUE_LABEL[k][r[k]])||String(r[k]);
    return `<div class="recap-row"><span class="k">${esc(FIELD_LABEL[k])}</span><span class="v">${esc(vLabel)}</span></div>`;
  }

  let recapRows;
  if(isCompleanno){
    // Ordine fisso per i campi principali, poi tutto il resto (Sala Bar,
    // note, film preferiti...) nell'ordine in cui compaiono nel documento
    const ordered=COMPLEANNO_ORDER.map(recapRow).join('');
    const rest=Object.keys(r).filter(k=>!COMPLEANNO_ORDER.includes(k)).map(recapRow).join('');
    recapRows=ordered+rest;
  } else {
    recapRows=Object.keys(r).map(recapRow).join('');
  }

  let foyerBox='';
  if(isCompleanno){
    if(r.foyerOraArrivo&&r.foyerOraDisponibileFino){
      foyerBox=`<div class="box"><div class="lbl">Da sapere</div><p>`
        +`Il servizio richiesto prevede la disponibilità dello spazio del foyer dalle <span class="time-hl">${esc(r.foyerOraArrivo)}</span> alle <span class="time-hl">${esc(r.foyerOraDisponibileFino)}</span>.`
        +(r.foyerOraFineFilm?` Il film in sala pubblica terminerà alle <span class="time-hl">${esc(r.foyerOraFineFilm)}</span>.`:'')
        +`</p></div>`;
    } else {
      foyerBox=`<div class="box"><div class="lbl">Da sapere</div><p>Ti comunicheremo l'orario preciso di arrivo in foyer non appena confermeremo lo spettacolo.</p></div>`;
    }
  }

  // Link invito da condividere con chi si vuole invitare: nessun dato viene
  // raccolto da noi, chi lo riceve conferma o rinuncia scrivendo direttamente
  // all'organizzatore via un mailto pre-compilato (vedi invito.html)
  let invitoBox='';
  if(isCompleanno&&['accettata','programmata'].includes(stato)){
    const inviteLink=location.origin+location.pathname.replace(/richiesta\.html$/,'')+'invito.html?id='+_currentId;
    window._inviteLink=inviteLink;
    const waText=`Sei invitato al compleanno di ${r.nomeFesteggiato||''}! 🎂 Tutti i dettagli qui: ${inviteLink}`;
    const waLink='https://wa.me/?text='+encodeURIComponent(waText);
    invitoBox=`<div class="box"><div class="lbl">Invita i tuoi ospiti</div>`
      +`<p>Condividi questo link con chi vuoi invitare: vedrà i dettagli della festa e potrà confermarti (o meno) la presenza direttamente via email, senza bisogno di registrarsi da nessuna parte.</p>`
      +`<div class="invite-actions">`
      +`<a href="${esc(inviteLink)}" target="_blank" rel="noopener">👁 Vedi l'invito</a>`
      +`<button type="button" onclick="navigator.clipboard.writeText(window._inviteLink);this.textContent='Copiato ✓'">🔗 Copia link invito</button>`
      +`<a href="${esc(waLink)}" target="_blank" rel="noopener">📲 WhatsApp</a>`
      +`</div></div>`;
  }

  let posterImg=r.posterUrl?`<img class="poster" src="${esc(r.posterUrl)}" alt="">`:'';
  if(posterImg&&r.filmId)posterImg=`<a href="film.html?id=${esc(r.filmId)}" target="_blank" rel="noopener">${posterImg}</a>`;
  const stateNoteText=autoEstimate?'':STATE_NOTE[stato];
  const stateNote=stateNoteText?`<p class="state-note">${esc(stateNoteText)}</p>`:'';
  const responseActions=(stato==='proposta_inviata'||autoEstimate)
    ?`<div class="response-actions">
        <button type="button" class="btn-confirm" onclick="rispondiProposta('accettata')">Confermo</button>
        <button type="button" class="btn-cancel" onclick="rispondiProposta('rifiutata')">Annullo</button>
      </div>`
    :'';

  const headerName=isCompleanno?(r.nomeFesteggiato||TIPO_LABEL[r.tipo]):r.nome;
  const headerSub=isCompleanno&&r.etaFesteggiato
    ?`${esc(String(r.etaFesteggiato))} anni · Richiesta inviata${r.createdAt?(' il '+new Date(r.createdAt).toLocaleDateString('it-IT',{day:'2-digit',month:'long',year:'numeric'})):''}`
    :`Richiesta inviata${r.createdAt?(' il '+new Date(r.createdAt).toLocaleDateString('it-IT',{day:'2-digit',month:'long',year:'numeric'})):''}`;

  // Con un film reale collegato mostriamo il suo sfondo come nella scheda
  // film, con "Compleanno al cinema" ben in evidenza sopra — altrimenti la
  // testata resta quella semplice di sempre (poster piccolo + etichetta)
  const heroHtml=(isCompleanno&&_currentBackdrop)?`
    <div class="hero">
      <img src="${esc(_currentBackdrop)}" alt="">
      <div class="scrim"></div>
      <div class="hero-content">
        <div class="hero-kind">🎂 ${esc(TIPO_LABEL[r.tipo]||'Compleanno al cinema')}</div>
        <div class="hero-title">${esc(headerName||'')}</div>
        <div class="hero-sub">${headerSub}</div>
      </div>
    </div>`:'';
  const cardHeadHtml=heroHtml?'':`
    <div class="card-head">
      ${posterImg}
      <div>
        <div class="kind">${esc(TIPO_LABEL[r.tipo]||r.tipo||'Richiesta')}</div>
        <div class="h1">${esc(headerName||'')}</div>
        <div class="sub">${headerSub}</div>
      </div>
    </div>`;

  card.innerHTML=`
    ${heroHtml}
    ${cardHeadHtml}
    ${timelineHtml}
    ${stateNote}
    ${propostaBox}
    ${foyerBox}
    ${responseActions}
    ${invitoBox}
    ${autoEstimate?'':`<div class="recap">${recapRows||'<div class="recap-row"><span class="k">Nessun dettaglio aggiuntivo</span></div>'}</div>`}
    <div class="actions">
      <button type="button" onclick="navigator.clipboard.writeText(location.href);this.textContent='Copiato ✓'">🔗 Copia link</button>
    </div>
  `;
}

async function init(){
  const id=new URLSearchParams(location.search).get('id');
  const card=document.getElementById('card');
  if(!id){
    card.innerHTML='<p class="state-msg">Link non valido: manca il codice della richiesta.</p>';
    return;
  }
  try{
    const snap=await getDoc(doc(db,'richiesteEventi',id));
    if(!snap.exists()){
      card.innerHTML='<p class="state-msg">Richiesta non trovata. Controlla il link, oppure scrivici a <a href="mailto:info@fabbricadeisogni.ch">info@fabbricadeisogni.ch</a>.</p>';
      return;
    }
    const r=snap.data();
    _currentId=id;
    _currentData=r;
    if(r.tipo==='compleanno'&&!r.proposta&&r.stato==='nuova'){
      try{
        const csSnap=await getDoc(doc(db,'settings','compleanno'));
        if(csSnap.exists())_csSettings=csSnap.data();
      }catch(e){/* preventivo con i valori di default, il resto funziona comunque */}
    }
    if(r.tipo==='compleanno'&&r.filmId){
      try{
        const filmSnap=await getDoc(doc(db,'films',r.filmId));
        if(filmSnap.exists()){
          const f=filmSnap.data();
          _currentBackdrop=f.backdrop||f.poster||'';
          _currentFilmTitle=f.title||'';
        }
      }catch(e){/* niente sfondo, il resto della pagina funziona comunque */}
    }
    render(r);
  }catch(e){
    card.innerHTML='<p class="state-msg">Impossibile caricare la richiesta al momento. Riprova tra poco.</p>';
  }
}
init();
</script>
