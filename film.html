<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Film — Cinema Multisala Teatro Mendrisio</title>
<meta name="description" content="Scheda del film in programma al Cinema Multisala Teatro di Mendrisio: trama, cast, trailer e orari degli spettacoli.">

<link rel="icon" type="image/svg+xml" href="favicon.svg?v=20260826d">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png?v=20260826d">
<link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16.png?v=20260826d">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png?v=20260826d">

<style>
  :root{
    --black:#2c2d2d;--white:#f7f4ef;--orange:#f0801a;--muted:#aaa;
    --line:rgba(255,255,255,.14);--ease:cubic-bezier(.16,1,.3,1);
    --surf:#3a3b3b;--surf2:#242525;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{background:var(--black);}
  body{background:var(--black);color:var(--white);font-family:Arial,Helvetica,sans-serif;line-height:1.5;overflow-x:clip;}
  a{color:inherit;text-decoration:none;}

  header{display:flex;justify-content:space-between;align-items:center;padding:20px max(4vw,env(safe-area-inset-right)) 20px max(4vw,env(safe-area-inset-left));}
  .brand{display:flex;align-items:center;gap:13px;}
  .brand-symbol{width:46px;height:29px;flex-shrink:0;}
  .brand-symbol svg{display:block;width:100%;height:100%;}
  .brand-name{font-size:.62rem;line-height:1.3;letter-spacing:.12em;text-transform:uppercase;opacity:.85;}
  nav{display:flex;gap:22px;font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;}
  @media(max-width:700px){nav{display:none;}}

  .back-row{max-width:1100px;margin:0 auto;padding:0 max(4vw,env(safe-area-inset-right)) 14px max(4vw,env(safe-area-inset-left));}
  .back-link{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--white);font-family:inherit;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:8px 14px;border-radius:30px;cursor:pointer;transition:background-color .2s var(--ease);}
  .back-link:hover{background:rgba(255,255,255,.12);}

  /* Sfondo a piena larghezza con titolo sovrapposto — stesso trattamento
     del pannello che si espandeva nel Programma di index.html, qui a
     pagina intera invece che dentro la card della lista */
  .film-still{position:relative;width:100%;aspect-ratio:21/9;max-height:62vh;min-height:240px;background:linear-gradient(135deg,var(--surf),var(--surf2));overflow:hidden;}
  .film-still img{width:100%;height:100%;object-fit:cover;display:block;}
  .film-still-empty{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:3rem;}
  .film-still-gradient{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 30%),linear-gradient(to top,rgba(0,0,0,.92) 0%,rgba(0,0,0,.4) 45%,rgba(0,0,0,0) 78%);pointer-events:none;}
  .film-still-title{position:absolute;left:max(4vw,env(safe-area-inset-left));right:max(4vw,env(safe-area-inset-right));bottom:28px;}
  .film-still-title h1{font-size:clamp(2rem,6vw,4.2rem);line-height:.98;font-weight:800;letter-spacing:-.02em;text-transform:uppercase;text-shadow:0 2px 20px rgba(0,0,0,.5);text-wrap:balance;}
  .film-still-title h1 .cinewow-mark{width:.62em;height:.34em;margin-right:.22em;}
  .film-still-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;font-size:.78rem;color:var(--muted);}
  .film-still-meta span{background:rgba(255,255,255,.12);padding:5px 12px;border-radius:20px;}

  /* Contenuto in colonna unica sotto lo sfondo, come nel pannello — non più
     una griglia locandina/testo affiancati */
  main{max-width:820px;margin:0 auto;padding:36px max(4vw,env(safe-area-inset-right)) 80px max(4vw,env(safe-area-inset-left));display:flex;flex-direction:column;gap:22px;}

  /* Locandina + bottone biglietto: non c'erano nel vecchio pannello (si
     sceglieva sempre il singolo spettacolo), ma su una pagina a sé stante
     sono comodi — inseriti come prima riga, prima della trama */
  .film-action-row{display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap;}
  .film-poster-thumb{width:110px;flex-shrink:0;}
  .film-poster-thumb img{width:100%;border-radius:10px;box-shadow:0 10px 26px rgba(0,0,0,.4);display:block;}
  .book-btn{display:inline-flex;align-items:center;gap:10px;background:var(--orange);color:#1b1006;font-size:.78rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:13px 22px;border-radius:9px;transition:transform .2s var(--ease),box-shadow .2s var(--ease);}
  .book-btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(240,128,26,.4);}

  .film-desc{color:#c5c5c5;font-size:.95rem;line-height:1.65;}
  .film-credits{color:#c2c2c2;font-size:.86rem;line-height:1.8;}
  .credit-label{color:var(--orange);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:.66rem;margin-right:6px;}
  .genre{color:#a3a3a3;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.14em;}

  .section-label{font-size:.66rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#a3a3a3;margin-bottom:10px;}

  /* Facciata cliccabile del trailer — l'iframe si carica solo al click, mai in anticipo */
  .trailer-facade{position:relative;display:block;width:100%;aspect-ratio:16/9;border:1px solid var(--line);background:#111;overflow:hidden;cursor:pointer;border-radius:10px;}
  .trailer-facade img{width:100%;height:100%;object-fit:cover;display:block;opacity:.7;transition:opacity .3s var(--ease);}
  .trailer-facade:hover img{opacity:.5;}
  .trailer-facade .play-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:var(--orange);color:#1b1006;display:flex;align-items:center;justify-content:center;font-size:1.05rem;}
  .trailer-embed{width:100%;aspect-ratio:16/9;border:1px solid var(--line);overflow:hidden;border-radius:10px;}
  .trailer-embed iframe{width:100%;height:100%;border:0;display:block;}

  /* "Prossimi spettacoli": formato compatto come nel pannello — solo i
     giorni che hanno davvero proiezioni, uno via l'altro (non una tabella
     con tutti i 7 giorni della settimana) */
  .sched-row{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line);}
  .sched-row:last-child{border-bottom:0;}
  .sched-day{flex:0 0 auto;font-size:.88rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#b0b0b0;}
  .sched-times{display:flex;flex-wrap:wrap;gap:8px;}
  .time-chip{display:inline-block;border:1px solid var(--line);padding:7px 13px;border-radius:20px;font-size:.82rem;letter-spacing:.02em;color:#a3a3a3;transition:border-color .2s var(--ease),background-color .2s var(--ease);}
  .time-chip:hover{border-color:var(--orange);background:rgba(240,128,26,.08);}
  .time-chip-hour{color:var(--orange);font-weight:800;}
  .no-shows{color:var(--muted);font-size:.85rem;}

  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
  .gallery img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;cursor:pointer;transition:transform .2s var(--ease);}
  .gallery img:hover{transform:scale(1.03);}

  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:50;padding:30px;cursor:zoom-out;}
  .lightbox.on{display:flex;}
  .lightbox img{max-width:100%;max-height:100%;border-radius:8px;}

  .loading,.empty-msg{text-align:center;color:var(--muted);padding:80px 20px;font-size:.88rem;}
  .spinner{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--orange);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .cinewow-mark{display:inline-block;width:.78em;height:.43em;margin-right:.28em;vertical-align:-.02em;filter:drop-shadow(0 0 .3em rgba(240,128,26,.55));}
  .cinewow-mark svg{display:block;width:100%;height:100%;}
  .cinewow-mark svg path{fill:none;stroke:var(--orange);stroke-width:1.3px;vector-effect:non-scaling-stroke;}
</style>
</head>
<body>

  <header>
    <a href="index.html#home" class="brand" aria-label="Cinema Multisala Teatro">
      <span class="brand-symbol">
<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <g fill="#f0801a">
    <g transform="translate(74.50716800516875,21) scale(3.3418716090059726)"><g transform="translate(-14.117936,-45.200568)"><g transform="matrix(0.26507501,0,0,0.26507501,95.958061,68.307823)">
      <path d="M -69.953258,336.85183 -117.30623,-87.172521 c -174.34505,27.622568 -196.94533,186.542022 -190.48811,228.155241 14.70812,153.53843 158.56072,212.37091 237.841082,195.86911 z"/>
      <path d="M 88.248722,15.066857 A 79.639091,79.639091 0 0 1 9.0071038,94.704957 79.639091,79.639091 0 0 1 -71.025493,15.861794 79.639091,79.639091 0 0 1 7.4172505,-64.563307 79.639091,79.639091 0 0 1 88.232852,13.477063 Z"/>
      <path d="M 1.076204,266.89859 -21.52408,158.20199 362.68075,-43.04816 380.97621,331.47082 Z"/>
    </g></g></g>
  </g>
</svg>
</span>
      <span class="brand-name">Cinema Multisala Teatro<br>Mendrisio</span>
    </a>
    <nav aria-label="Navigazione principale">
      <a href="index.html#programma">Programma</a>
      <a href="index.html#proiezioni-speciali">Eventi speciali</a>
      <a href="index.html#contatti">Contatti</a>
    </nav>
  </header>

  <div class="back-row">
    <button type="button" class="back-link" onclick="if(history.length>1){history.back();}else{location.href='index.html#programma';}">← Torna indietro</button>
  </div>

<div id="root">
  <div class="loading"><div class="spinner"></div>Caricamento in corso...</div>
</div>

<div class="lightbox" id="lightbox" onclick="this.classList.remove('on')"><img id="lightbox-img" src="" alt=""></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getFirestore,collection,getDocs,doc,getDoc,onSnapshot,query,where}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const FB={apiKey:"AIzaSyCYM1tZsUI-pz3D0J6EWEMqyDxrk9hep1o",authDomain:"cinemanager-4c67c.firebaseapp.com",projectId:"cinemanager-4c67c",storageBucket:"cinemanager-4c67c.firebasestorage.app",messagingSenderId:"730874662111",appId:"1:730874662111:web:8a4a501dd81644bc96ed6a"};
const SALE={'1':{nome:'Teatro'},'2':{nome:'Ciak'},'3':{nome:'1908'},'4':{nome:'Mignon'}};
const DITB=['Giovedì','Venerdì','Sabato','Domenica','Lunedì','Martedì','Mercoledì'];
const TICKET_DEFAULT='https://multisala.mendrisiocinema.ch';
const TMDB_API_KEY='311ff7247664eb7804d555d57be08219';
const TMDB_IMG='https://image.tmdb.org/t/p/';
const CINEWOW_SVG='<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g transform="translate(74.50716800516875,21) scale(3.3418716090059726)"><g transform="translate(-14.117936,-45.200568)"><g transform="matrix(0.26507501,0,0,0.26507501,95.958061,68.307823)"><path d="M -69.953258,336.85183 -117.30623,-87.172521 c -174.34505,27.622568 -196.94533,186.542022 -190.48811,228.155241 14.70812,153.53843 158.56072,212.37091 237.841082,195.86911 z"/><path d="M 88.248722,15.066857 A 79.639091,79.639091 0 0 1 9.0071038,94.704957 79.639091,79.639091 0 0 1 -71.025493,15.861794 79.639091,79.639091 0 0 1 7.4172505,-64.563307 79.639091,79.639091 0 0 1 88.232852,13.477063 Z"/><path d="M 1.076204,266.89859 -21.52408,158.20199 362.68075,-43.04816 380.97621,331.47082 Z"/></g></g></g></svg>';

function esc(s){return(s||'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function cinewowMark(f){return f&&f.cinewow?'<span class="cinewow-mark" aria-label="Cinewow">'+CINEWOW_SVG+'</span>':'';}
function dur(m){return m?(Math.floor(m/60)+'h'+String(m%60).padStart(2,'0')):'';}
function cinemaWeekStart(){const t=new Date();t.setHours(0,0,0,0);const dow=t.getDay(),diff=dow>=4?dow-4:dow+3;const d=new Date(t);d.setDate(d.getDate()-diff);return d;}
function wdays(ws,n){return Array.from({length:n||7},(_,i)=>{const d=new Date(ws);d.setDate(d.getDate()+i);return d;});}
function wdates(ws,n){return wdays(ws,n).map(d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`);}
function toLocalDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function fsShort(d){return d.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit'});}
// Gio/Ven/Sab/Dom e Lun fino alle 12:04 → solo settimana corrente (fino a mercoledì).
// Da Lun 12:05 in poi (e Mar/Mer) → estende fino al mercoledì della settimana successiva.
function shouldExtendWeek(){
  const t=new Date(),dow=t.getDay();
  if(dow===2||dow===3)return true; // Martedì, Mercoledì
  if(dow===1)return t.getHours()>12||(t.getHours()===12&&t.getMinutes()>=5); // Lunedì dalle 12:05
  return false;
}

const app=initializeApp(FB);
const db=getFirestore(app);
const ws=cinemaWeekStart();
const spanDays=shouldExtendWeek()?14:7;
const days=wdays(ws,spanDays);
const wd=wdates(ws,spanDays);
const todayStr=toLocalDate(new Date());

const params=new URLSearchParams(location.search);
const filmId=params.get('id');

async function tmdbGallery(tmdbId,exclude){
  if(!tmdbId||!TMDB_API_KEY)return[];
  try{
    const res=await fetch(`https://api.themoviedb.org/3/movie/${tmdbId}/images?api_key=${TMDB_API_KEY}`);
    if(!res.ok)return[];
    const data=await res.json();
    const pics=(data.backdrops||[]).filter(b=>b.file_path&&b.file_path!==exclude).slice(0,6);
    return pics.map(b=>TMDB_IMG+'w780'+b.file_path);
  }catch(e){return[];}
}

function nowHM(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}

// "Prossimi spettacoli" in formato compatto — come nel pannello che si
// espandeva nel Programma: solo i giorni che hanno davvero proiezioni,
// uno via l'altro, non una riga per ogni giorno della settimana
function renderSchedule(filmDoc,perShowLinks){
  const nowStr=nowHM();
  const ticket=filmDoc.ticketUrl||TICKET_DEFAULT;
  const rows=[];
  days.forEach((d,i)=>{
    const ds=wd[i];
    if(ds<todayStr)return; // mai giorni già trascorsi
    let times=window._shows.filter(s=>s.day===ds).sort((a,b)=>a.start.localeCompare(b.start));
    if(ds===todayStr)times=times.filter(s=>s.start>=nowStr); // solo orari non ancora iniziati
    if(!times.length)return; // formato compatto: il giorno senza proiezioni non compare affatto
    rows.push({label:DITB[i%7]+(ds===todayStr?' · Oggi':'')+' '+fsShort(d),times});
  });
  if(!rows.length)return '<div class="no-shows">Nessuna proiezione rimanente in programma.</div>';
  return rows.map(r=>{
    const chips=r.times.map(t=>{
      const si=SALE[t.sala];
      const url=(perShowLinks&&t.ticketUrl)?t.ticketUrl:ticket;
      return `<a class="time-chip" href="${esc(url)}" target="_blank" rel="noopener"><span class="time-chip-hour">${esc(t.start)}</span>${si?' · '+esc(si.nome):''}</a>`;
    }).join('');
    return `<div class="sched-row"><span class="sched-day">${esc(r.label)}</span><span class="sched-times">${chips}</span></div>`;
  }).join('');
}

function openLightbox(src){
  document.getElementById('lightbox-img').src=src;
  document.getElementById('lightbox').classList.add('on');
}
window.openLightbox=openLightbox;

// Facciata cliccabile del trailer — l'iframe YouTube si carica solo al click, mai in anticipo
function playTrailer(btn){
  const id=btn.dataset.yt;
  const wrap=document.createElement('div');
  wrap.className='trailer-embed';
  wrap.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${esc(id)}?autoplay=1&rel=0" title="Trailer" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
  btn.replaceWith(wrap);
}
window.playTrailer=playTrailer;

async function render(filmDoc,perShowLinks){
  const backdrop=filmDoc.backdrop||filmDoc.poster||'';
  const dStr=dur(filmDoc.duration);
  const ticket=filmDoc.ticketUrl||TICKET_DEFAULT;
  const desc=filmDoc.desc||filmDoc.description||'';
  const creditsParts=[];
  if(filmDoc.director)creditsParts.push('<span class="credit-label">Regia</span> '+esc(filmDoc.director));
  const castNames=(filmDoc.cast||'').split(',').map(s=>s.trim()).filter(Boolean).slice(0,5);
  if(castNames.length)creditsParts.push('<span class="credit-label">Con</span> '+esc(castNames.join(', ')));
  const creditsHtml=creditsParts.length?'<p class="film-credits">'+creditsParts.join('&nbsp; &nbsp;')+'</p>':'';

  let gallery=[filmDoc.poster,filmDoc.backdrop].filter(Boolean);
  const extra=await tmdbGallery(filmDoc.tmdbId,filmDoc.backdrop?filmDoc.backdrop.split('/').pop():null);
  gallery=gallery.concat(extra.filter(u=>!gallery.includes(u))).slice(0,7);

  document.title=filmDoc.title+' — Cinema Multisala Teatro Mendrisio';

  document.getElementById('root').innerHTML=`
    <div class="film-still">
      ${backdrop?`<img src="${esc(backdrop)}" alt="${esc(filmDoc.title)}">`:'<div class="film-still-empty">🎬</div>'}
      <div class="film-still-gradient"></div>
      <div class="film-still-title">
        <h1>${cinewowMark(filmDoc)}${esc(filmDoc.title)}</h1>
        <div class="film-still-meta">${dStr?`<span>${dStr}</span>`:''}${filmDoc.version?`<span>${esc(filmDoc.version)}</span>`:''}${filmDoc.distributore?`<span>${esc(filmDoc.distributore)}</span>`:''}</div>
      </div>
    </div>
    <main>
      <div class="film-action-row">
        ${filmDoc.poster?`<div class="film-poster-thumb"><img src="${esc(filmDoc.poster)}" alt="${esc(filmDoc.title)}"></div>`:''}
        <a class="book-btn" href="${esc(ticket)}" target="_blank" rel="noopener">Acquista / Prenota</a>
      </div>
      ${desc?`<p class="film-desc">${esc(desc)}</p>`:''}
      ${creditsHtml}
      ${filmDoc.genre?`<span class="genre">${esc(filmDoc.genre)}</span>`:''}
      ${filmDoc.trailer?`<div><div class="section-label">Trailer</div><button type="button" class="trailer-facade" data-yt="${esc(filmDoc.trailer)}" onclick="playTrailer(this)" aria-label="Guarda il trailer di ${esc(filmDoc.title)}"><img src="https://img.youtube.com/vi/${esc(filmDoc.trailer)}/hqdefault.jpg" alt="" loading="lazy"><span class="play-icon">▶</span></button></div>`:''}
      <div>
        <div class="section-label">Prossimi spettacoli</div>
        ${renderSchedule(filmDoc,perShowLinks)}
      </div>
      ${gallery.length?`<div><div class="section-label">Foto</div><div class="gallery">${gallery.map(u=>`<img src="${esc(u)}" alt="" loading="lazy" onclick="openLightbox('${esc(u)}')">`).join('')}</div></div>`:''}
    </main>`;
}

async function init(){
  if(!filmId){
    document.getElementById('root').innerHTML='<div class="empty-msg">⚠️ Film non specificato.</div>';
    return;
  }
  try{
    // Query mirata sugli spettacoli di QUESTO film (where lato server su
    // un singolo campo, nessun indice composito da creare) — non l'intera
    // collezione shows, che con la programmazione storica può crescere
    // parecchio: altrimenti ogni apertura della scheda costerebbe
    // centinaia di letture Firestore invece di poche decine
    const[filmSnap,showsSnap]=await Promise.all([
      getDoc(doc(db,'films',filmId)),
      getDocs(query(collection(db,'shows'),where('filmId','==',filmId)))
    ]);
    if(!filmSnap.exists()){
      document.getElementById('root').innerHTML='<div class="empty-msg">⚠️ Film non trovato.</div>';
      return;
    }
    window._shows=showsSnap.docs.map(d=>({id:d.id,...d.data()})).filter(s=>wd.includes(s.day));
    const filmDoc={id:filmSnap.id,...filmSnap.data()};
    onSnapshot(doc(db,'settings','pubFlag'),snap=>{
      const data=snap.exists()?snap.data():{};
      const pub=data.published||false;
      const perShowLinks=data.perShowTicketLinks===true;
      if(pub)render(filmDoc,perShowLinks);
      else document.getElementById('root').innerHTML='<div class="empty-msg">🎬 Programmazione in elaborazione — torna a trovarci a breve.</div>';
    },()=>{document.getElementById('root').innerHTML='<div class="empty-msg">🎬 Programmazione in elaborazione — torna a trovarci a breve.</div>';});
  }catch(e){
    console.error(e);
    document.getElementById('root').innerHTML='<div class="empty-msg">⚠️ Impossibile caricare. Riprova tra qualche minuto.</div>';
  }
}
init();
</script>
</body>
</html>
