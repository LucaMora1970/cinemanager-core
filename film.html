<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png?v=20260826d">
<link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16.png?v=20260826d">

<style>
  :root{
    --black:#2c2d2d;--white:#f7f4ef;--orange:#f0801a;--muted:#aaa;
    --line:rgba(255,255,255,.14);--ease:cubic-bezier(.16,1,.3,1);
    --surf:#3a3b3b;--surf2:#242525;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  /* Non il piatto var(--black): il colore che si vede davvero sulla home
     è questo gradiente quasi nero (.panel::before in index.html), applicato
     a ogni sezione — fixed così resta uguale scorrendo tutta la pagina,
     invece di stirarsi dall'inizio alla fine del contenuto */
  html{background:#050505;}
  body{background:linear-gradient(120deg,#020202,#111 58%,#050505);background-attachment:fixed;color:var(--white);font-family:Arial,Helvetica,sans-serif;line-height:1.5;overflow-x:clip;}
  a{color:inherit;text-decoration:none;}

  header{display:flex;justify-content:space-between;align-items:center;padding:20px max(4vw,env(safe-area-inset-right)) 20px max(4vw,env(safe-area-inset-left));}
  .brand{display:flex;align-items:center;gap:13px;}
  .brand-symbol{width:46px;height:29px;flex-shrink:0;}
  .brand-symbol svg{display:block;width:100%;height:100%;}
  .brand-name{font-size:.62rem;line-height:1.3;letter-spacing:.12em;text-transform:uppercase;opacity:.85;}
  nav{display:flex;gap:22px;font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;}
  @media(max-width:700px){nav{display:none;}}

  .back-row{max-width:1100px;margin:0 auto;padding:0 max(4vw,env(safe-area-inset-right)) 14px max(4vw,env(safe-area-inset-left));}
  .back-link{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--white);font-family:inherit;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:8px 14px;border-radius:30px;cursor:pointer;transition:background-color .2s var(--ease);}
  .back-link:hover{background:rgba(255,255,255,.12);}

  /* object-fit:contain, non cover: l'immagine non viene mai ritagliata,
     né su desktop né su mobile (stesso box per entrambi, nessuna media
     query dedicata). Se l'immagine non riempie tutto il riquadro, resta
     ancorata in basso (object-position bottom) così il suo bordo inferiore
     — e quindi la dissolvenza/il titolo sovrapposti — restano comunque
     al fondo del riquadro, non "staccati" sopra uno spazio vuoto */
  .hero{position:relative;width:100%;aspect-ratio:16/9;max-height:64vh;background:linear-gradient(135deg,var(--surf),var(--surf2));overflow:hidden;}
  .hero img{width:100%;height:100%;object-fit:contain;object-position:center bottom;display:block;}
  /* Dissolvenza anche in alto, non solo in basso: l'immagine si stacca meno
     dall'header sopra (sfondo quasi nero), resta più integrata nella pagina */
  .hero .scrim{position:absolute;inset:0;background:linear-gradient(180deg,#050505 0%,rgba(0,0,0,0) 16%,rgba(0,0,0,.1) 50%,rgba(0,0,0,.35) 70%,#050505 100%);}
  .hero .hero-content{position:absolute;left:0;right:0;bottom:0;max-width:1100px;margin:0 auto;padding:0 max(4vw,env(safe-area-inset-right)) 26px max(4vw,env(safe-area-inset-left));width:100%;}
  .hero .title{font-size:clamp(1.6rem,4vw,2.6rem);font-weight:800;text-wrap:balance;text-shadow:0 2px 8px rgba(0,0,0,.6);}
  .hero .title .cinewow-mark{width:.62em;height:.34em;margin-right:.22em;}
  .hero .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:.72rem;color:var(--muted);}
  .hero .meta span{background:rgba(255,255,255,.1);padding:4px 11px;border-radius:20px;}

  main{max-width:1100px;margin:0 auto;padding:34px max(4vw,env(safe-area-inset-right)) 70px max(4vw,env(safe-area-inset-left));}
  .layout{display:grid;grid-template-columns:220px 1fr;gap:32px;}
  .poster-col img{width:100%;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.4);display:block;}
  .poster-col .no-poster{width:100%;aspect-ratio:2/3;border-radius:14px;background:linear-gradient(135deg,var(--surf),var(--surf2));display:flex;align-items:center;justify-content:center;font-size:3.2rem;}
  .book-btn{
    margin-top:16px;width:100%;display:flex;align-items:center;justify-content:center;gap:7px;
    background:var(--orange);color:#1b1006;font-size:.85rem;font-weight:800;letter-spacing:.03em;
    padding:13px 16px;border-radius:10px;transition:transform .2s var(--ease),box-shadow .2s var(--ease);
  }
  .book-btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(240,128,26,.4);}

  .info-col h2{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--orange);margin:26px 0 12px;}
  .info-col h2:first-child{margin-top:0;}
  .plot{font-size:.9rem;color:#d9d5cd;line-height:1.6;}
  .credits{font-size:.82rem;color:var(--muted);}
  /* "Perché lo abbiamo scelto" — solo per i film Cinewow con il campo
     compilato, come già nel pannello del Programma */
  .cinewow-reason{display:flex;gap:10px;align-items:flex-start;border-left:2px solid var(--orange);padding:2px 0 2px 14px;font-size:.88rem;line-height:1.55;font-style:italic;color:#d9d3c8;}
  .cinewow-reason svg{width:15px;height:auto;flex-shrink:0;margin-top:4px;}
  .cinewow-reason svg path{fill:var(--orange);}
  .credits b{color:var(--white);font-weight:700;}

  .trailer-wrap{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--surf2);}
  .trailer-wrap iframe{width:100%;height:100%;border:0;display:block;}

  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
  .gallery img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;cursor:pointer;transition:transform .2s var(--ease);}
  .gallery img:hover{transform:scale(1.03);}

  /* Una card per giorno (giorno+data una sola volta), con dentro un
     riquadro per ogni orario di quel giorno (solo ora+sala) — niente più
     giorno/data ripetuti su ogni box, niente separatore tra un giorno e
     l'altro: lo fa già il bordo della card */
  .days-list{display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px;}
  .day-card{position:relative;border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:9px;}
  .day-card.today{border-color:rgba(240,128,26,.5);}
  .day-card-head{display:flex;flex-direction:column;gap:2px;}
  .dc-day{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#c2c2c2;}
  .day-card.today .dc-day{color:var(--orange);}
  .dc-date{font-size:.68rem;color:var(--muted);font-variant-numeric:tabular-nums;}
  .day-card-times{display:flex;flex-wrap:wrap;gap:8px;}
  .dc-time{display:flex;flex-direction:column;align-items:center;padding:7px 11px;border:1px solid var(--line);border-radius:6px;font-size:.95rem;font-weight:800;color:var(--orange);font-variant-numeric:tabular-nums;line-height:1.2;transition:color .2s var(--ease),border-color .2s var(--ease),background-color .2s var(--ease);}
  .dc-time:hover{color:var(--white);border-color:var(--orange);background:rgba(240,128,26,.08);}
  .dc-sala{font-size:.55rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#a3a3a3;margin-top:3px;}
  /* Giornata a prezzo ridotto (es. "La domenica del cinema Allianz"): stesso
     badge d'angolo dei day-tab della home (.day-tab-discount), una volta
     sola sulla card, non ripetuto su ogni orario */
  .dc-discount{position:absolute;top:-8px;right:-6px;background:var(--orange);color:#1b1006;font-size:.5rem;font-weight:800;letter-spacing:.02em;line-height:1;border-radius:5px;padding:3px 4px;white-space:nowrap;pointer-events:none;}
  .no-shows{color:var(--muted);font-size:.82rem;}

  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:50;padding:30px;cursor:zoom-out;}
  .lightbox.on{display:flex;}
  .lightbox img{max-width:100%;max-height:100%;border-radius:8px;}

  .loading,.empty-msg{text-align:center;color:var(--muted);padding:80px 20px;font-size:.88rem;}
  .spinner{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--orange);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .cinewow-mark{display:inline-block;width:.78em;height:.43em;margin-right:.28em;vertical-align:-.02em;filter:drop-shadow(0 0 .3em rgba(240,128,26,.55));}
  .cinewow-mark svg{display:block;width:100%;height:100%;}
  .cinewow-mark svg path{fill:none;stroke:var(--orange);stroke-width:1.3px;vector-effect:non-scaling-stroke;}

  @media(max-width:720px){
    .layout{grid-template-columns:1fr;}
    /* Su mobile la locandina scende sotto ai testi (su desktop resta a
       fianco, invariata) — solo l'ordine visivo cambia, il markup no */
    .poster-col{order:2;max-width:200px;margin:24px auto 0;}
    .info-col{order:1;}
  }
</style>
</head>

      <path d="M 88.248722,15.066857 A 79.639091,79.639091 0 0 1 9.0071038,94.704957 79.639091,79.639091 0 0 1 -71.025493,15.861794 79.639091,79.639091 0 0 1 7.4172505,-64.563307 79.639091,79.639091 0 0 1 88.232852,13.477063 Z"/>

  <div class="back-row">

<div id="root">

<div class="lightbox" id="lightbox" onclick="this.classList.remove('on')"><img id="lightbox-img" src="" alt=""></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getFirestore,collection,getDocs,doc,getDoc,onSnapshot,query,where}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const FB={apiKey:"AIzaSyCYM1tZsUI-pz3D0J6EWEMqyDxrk9hep1o",authDomain:"cinemanager-4c67c.firebaseapp.com",projectId:"cinemanager-4c67c",storageBucket:"cinemanager-4c67c.firebasestorage.app",messagingSenderId:"730874662111",appId:"1:730874662111:web:8a4a501dd81644bc96ed6a"};
const SALE={'1':{nome:'Teatro'},'2':{nome:'Ciak'},'3':{nome:'1908'},'4':{nome:'Mignon'}};
const TICKET_DEFAULT='https://multisala.mendrisiocinema.ch';
const TMDB_API_KEY='311ff7247664eb7804d555d57be08219';
const TMDB_IMG='https://image.tmdb.org/t/p/';
const CINEWOW_SVG='<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g transform="translate(74.50716800516875,21) scale(3.3418716090059726)"><g transform="translate(-14.117936,-45.200568)"><g transform="matrix(0.26507501,0,0,0.26507501,95.958061,68.307823)"><path d="M -69.953258,336.85183 -117.30623,-87.172521 c -174.34505,27.622568 -196.94533,186.542022 -190.48811,228.155241 14.70812,153.53843 158.56072,212.37091 237.841082,195.86911 z"/><path d="M 88.248722,15.066857 A 79.639091,79.639091 0 0 1 9.0071038,94.704957 79.639091,79.639091 0 0 1 -71.025493,15.861794 79.639091,79.639091 0 0 1 7.4172505,-64.563307 79.639091,79.639091 0 0 1 88.232852,13.477063 Z"/><path d="M 1.076204,266.89859 -21.52408,158.20199 362.68075,-43.04816 380.97621,331.47082 Z"/></g></g></g></svg>';

function esc(s){return(s||'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function cinewowMark(f){return f&&f.cinewow?'<span class="cinewow-mark" aria-label="Cinewow">'+CINEWOW_SVG+'</span>':'';}
function dur(m){return m?(Math.floor(m/60)+'h'+String(m%60).padStart(2,'0')):'';}
function toLocalDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function fsShort(d){return d.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit'});}

const app=initializeApp(FB);
const db=getFirestore(app);
const todayStr=toLocalDate(new Date());

const params=new URLSearchParams(location.search);
const filmId=params.get('id');

async function tmdbGallery(tmdbId,exclude){
  if(!tmdbId||!TMDB_API_KEY)return[];
  try{
    const res=await fetch(`https://api.themoviedb.org/3/movie/${tmdbId}/images?api_key=${TMDB_API_KEY}`);
    if(!res.ok)return[];
    const data=await res.json();
    const pics=(data.backdrops||[]).filter(b=>b.file_path&&b.file_path!==exclude).slice(0,6);
    return pics.map(b=>TMDB_IMG+'w780'+b.file_path);
  }catch(e){return[];}
}

function nowHM(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}

const DOW=['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];

// Raggruppa TUTTI gli spettacoli futuri del film per giorno (window._shows
// non è più limitato alla finestra "settimana cinema" — vedi init()):
// un'anteprima con un solo spettacolo anche a settimane di distanza deve
// comunque comparire qui, non solo se cade nei prossimi 7-14 giorni
function renderWeekTable(filmDoc,perShowLinks){
  const nowStr=nowHM();
  const ticket=filmDoc.ticketUrl||TICKET_DEFAULT;
  const byDay={};
  window._shows.forEach(s=>{
    if(s.day<todayStr)return; // mai giorni già trascorsi
    if(s.day===todayStr&&s.start<nowStr)return; // solo orari non ancora iniziati
    (byDay[s.day]=byDay[s.day]||[]).push(s);
  });
  const dayKeys=Object.keys(byDay).sort();
  if(!dayKeys.length)return '<div class="no-shows">Nessuna proiezione rimanente in programma.</div>';
  const cards=dayKeys.map(ds=>{
    const times=byDay[ds].slice().sort((a,b)=>a.start.localeCompare(b.start));
    const d=new Date(ds+'T12:00:00');
    const isToday=ds===todayStr;
    // Giornata a prezzo ridotto: un solo badge sulla card, non ripetuto per ogni orario
    const disc=discountEventForDate(ds);
    const discBadge=disc?`<span class="dc-discount">${esc(disc.etichettaProgramma||disc.sottotitolo||'Prezzo ridotto')}</span>`:'';
    const timesHtml=times.map(s=>{
      const si=SALE[s.sala];
      const url=(perShowLinks&&s.ticketUrl)?s.ticketUrl:ticket;
      return `<a class="dc-time" href="${esc(url)}" target="_blank" rel="noopener">${esc(s.start)}${si?`<span class="dc-sala">${esc(si.nome)}</span>`:''}</a>`;
    }).join('');
    return `<div class="day-card${isToday?' today':''}">${discBadge}<div class="day-card-head"><span class="dc-day">${isToday?'Oggi':DOW[d.getDay()]}</span><span class="dc-date">${fsShort(d)}</span></div><div class="day-card-times">${timesHtml}</div></div>`;
  }).join('');
  return `<div class="days-list">${cards}</div>`;
}

// Evento generico (non anteprima) con prezzo ridotto su una data precisa —
// stesso criterio della home (discountEventForDate in index.html)
function discountEventForDate(dateStr){
  if(!dateStr)return null;
  return(window._discountEvents||[]).find(e=>e.data===dateStr)||null;
}

function openLightbox(src){
  document.getElementById('lightbox-img').src=src;
  document.getElementById('lightbox').classList.add('on');
}
window.openLightbox=openLightbox;

async function render(filmDoc,perShowLinks){
  const backdrop=filmDoc.backdrop||filmDoc.poster||'';
  const dStr=dur(filmDoc.duration);
  const ticket=filmDoc.ticketUrl||TICKET_DEFAULT;
  const credits=[filmDoc.director?`<div class="credits"><b>Regia:</b> ${esc(filmDoc.director)}</div>`:'',filmDoc.cast?`<div class="credits" style="margin-top:4px"><b>Cast:</b> ${esc(filmDoc.cast)}</div>`:''].join('');

  let gallery=[filmDoc.poster,filmDoc.backdrop].filter(Boolean);
  const extra=await tmdbGallery(filmDoc.tmdbId,filmDoc.backdrop?filmDoc.backdrop.split('/').pop():null);
  gallery=gallery.concat(extra.filter(u=>!gallery.includes(u))).slice(0,7);

  document.title=filmDoc.title+' — Cinema Multisala Teatro Mendrisio';

  document.getElementById('root').innerHTML=`
    <div class="hero">
      ${backdrop?`<img src="${esc(backdrop)}" alt="${esc(filmDoc.title)}">`:''}
      <div class="scrim"></div>
      <div class="hero-content">
        <div class="title">${cinewowMark(filmDoc)}${esc(filmDoc.title)}</div>
        <div class="meta">${dStr?`<span>${dStr}</span>`:''}${filmDoc.version?`<span>${esc(filmDoc.version)}</span>`:''}${filmDoc.distributore?`<span>${esc(filmDoc.distributore)}</span>`:''}</div>
      </div>
    </div>
    <main>
      <div class="layout">
        <div class="poster-col">
          ${filmDoc.poster?`<img src="${esc(filmDoc.poster)}" alt="${esc(filmDoc.title)}">`:'<div class="no-poster">🎬</div>'}
          <a class="book-btn" href="${esc(ticket)}" target="_blank" rel="noopener">Acquista / Prenota</a>
        </div>
        <div class="info-col">
          ${credits?`<h2>Cast &amp; Crew</h2>${credits}`:''}
          ${filmDoc.cinewow&&filmDoc.cinewowReason?`<h2>Perché lo abbiamo scelto</h2><p class="cinewow-reason">${CINEWOW_SVG}<span>${esc(filmDoc.cinewowReason)}</span></p>`:''}
          ${filmDoc.desc||filmDoc.description?`<h2>Trama</h2><div class="plot">${esc(filmDoc.desc||filmDoc.description)}</div>`:''}
          ${filmDoc.trailer?`<h2>Trailer</h2><div class="trailer-wrap"><iframe src="https://www.youtube.com/embed/${esc(filmDoc.trailer)}" title="Trailer" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`:''}
          <h2>Prossimi spettacoli</h2>
          ${renderWeekTable(filmDoc,perShowLinks)}
          ${gallery.length?`<h2>Foto</h2><div class="gallery">${gallery.map(u=>`<img src="${esc(u)}" alt="" loading="lazy" onclick="openLightbox('${esc(u)}')">`).join('')}</div>`:''}
        </div>
      </div>
    </main>`;
}

async function init(){
  if(!filmId){
    document.getElementById('root').innerHTML='<div class="empty-msg">⚠️ Film non specificato.</div>';
    return;
  }
  try{
    // Query mirata sugli spettacoli di QUESTO film (where lato server su
    // un singolo campo, nessun indice composito da creare) — non l'intera
    // collezione shows, che con la programmazione storica può crescere
    // parecchio: altrimenti ogni apertura della scheda costerebbe
    // centinaia di letture Firestore invece di poche decine
    const[filmSnap,showsSnap,discSnap]=await Promise.all([
      getDoc(doc(db,'films',filmId)),
      getDocs(query(collection(db,'shows'),where('filmId','==',filmId))),
      // Solo gli eventiSpeciali con prezzo ridotto (where su un singolo
      // campo, nessun indice composito) — servono per il badge sugli
      // orari, non l'intera collezione eventiSpeciali
      getDocs(query(collection(db,'eventiSpeciali'),where('prezzoRidotto','==',true)))
    ]);
    if(!filmSnap.exists()){
      document.getElementById('root').innerHTML='<div class="empty-msg">⚠️ Film non trovato.</div>';
      return;
    }
    // Tutti gli spettacoli futuri di QUESTO film, non solo quelli entro la
    // finestra "settimana cinema" usata dal Programma — un'anteprima o un
    // evento speciale può avere il suo unico spettacolo più avanti nel
    // tempo, e qui deve comparire comunque (niente "nessuna proiezione" per
    // un film che in realtà ha un biglietto acquistabile)
    window._shows=showsSnap.docs.map(d=>({id:d.id,...d.data()}));
    window._discountEvents=discSnap.docs.map(d=>({id:d.id,...d.data()}));
    const filmDoc={id:filmSnap.id,...filmSnap.data()};
    onSnapshot(doc(db,'settings','pubFlag'),snap=>{
      const data=snap.exists()?snap.data():{};
      const pub=data.published||false;
      const perShowLinks=data.perShowTicketLinks===true;
      if(pub)render(filmDoc,perShowLinks);
      else document.getElementById('root').innerHTML='<div class="empty-msg">🎬 Programmazione in elaborazione — torna a trovarci a breve.</div>';
    },()=>{document.getElementById('root').innerHTML='<div class="empty-msg">🎬 Programmazione in elaborazione — torna a trovarci a breve.</div>';});
  }catch(e){
    console.error(e);
    document.getElementById('root').innerHTML='<div class="empty-msg">⚠️ Impossibile caricare. Riprova tra qualche minuto.</div>';
  }
}
init();
</script>
</body>
</html>
