<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Timbratura</title>
<style>
  :root{--bg:#0f1115;--surf:#181b22;--txt:#f2f3f5;--txt2:#9aa1ad;--acc:#ef7815;--ok:#3ac47a;--err:#e84a4a;--out:#e84a4a}
  @media (prefers-color-scheme:light){:root{--bg:#f4f5f7;--surf:#fff;--txt:#14161a;--txt2:#5b6370}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
  .card{width:100%;max-width:380px;background:var(--surf);border-radius:18px;padding:26px 22px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.25)}
  .logo{display:block;width:210px;max-width:70%;height:auto;margin:0 auto 14px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--txt2);font-size:13px;margin-bottom:20px}
  .clock{font-size:34px;font-weight:700;letter-spacing:1px;margin:4px 0 18px;font-variant-numeric:tabular-nums}
  input{width:100%;font-size:30px;text-align:center;letter-spacing:10px;padding:14px;border-radius:12px;border:2px solid var(--txt2);background:transparent;color:var(--txt);-webkit-text-security:disc}
  input:focus{outline:none;border-color:var(--acc)}
  button{width:100%;margin-top:14px;font-size:18px;font-weight:700;padding:16px;border:0;border-radius:12px;cursor:pointer;background:var(--acc);color:#000}
  button.entrata{background:var(--ok);color:#fff}
  button.uscita{background:var(--out);color:#fff}
  button.ghost{background:transparent;color:var(--txt2);font-size:15px;font-weight:500;margin-top:6px}
  button:disabled{opacity:.5}
  .msg{min-height:20px;margin-top:12px;font-size:14px;color:var(--err)}
  .big{font-size:56px;margin:6px 0}
  .name{font-size:22px;font-weight:700;margin:6px 0}
  .hide{display:none}
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="img/logo-cinema.svg" alt="Cinema Multisala Teatro">
  <h1 id="sede">Timbratura</h1>
  <div class="sub" id="sub">Inserisci il tuo PIN personale</div>
  <div class="clock" id="clock">--:--</div>

  <div id="s-pin">
    <input id="pin" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="••••" aria-label="PIN">
    <button id="go" onclick="check()">Continua</button>
  </div>

  <div id="s-conf" class="hide">
    <div class="name" id="who"></div>
    <div class="sub" id="state"></div>
    <button id="punch" onclick="punch()"></button>
    <button class="ghost" onclick="reset()">Annulla</button>
  </div>

  <div id="s-done" class="hide">
    <div class="big" id="doneIcon">✓</div>
    <div class="name" id="doneName"></div>
    <div class="sub" id="doneTxt"></div>
  </div>

  <div class="msg" id="msg"></div>
</div>

<script>
var FN='https://cinema-import-proxy.netlify.app/.netlify/functions/timbra';
var q=new URLSearchParams(location.search);
var K=q.get('k')||'', SEDE=q.get('s')||'';
var _pin='', _next='', _timer=null;
function $(id){return document.getElementById(id);}
function show(id){['s-pin','s-conf','s-done'].forEach(function(x){$(x).classList.toggle('hide',x!==id);});}
function msg(t){$('msg').textContent=t||'';}
function tick(){
  var d=new Date();
  $('clock').textContent=d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
}
setInterval(tick,10000);tick();
if(SEDE)$('sede').textContent='Timbratura · '+SEDE;
if(!K){msg('QR non valido: scansiona il codice esposto in sede.');$('go').disabled=true;}

async function call(action){
  var r;
  try{
    r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:action,pin:_pin,k:K,sede:SEDE})});
  }catch(e){throw new Error('Connessione assente: riprova.');}
  var j={};try{j=await r.json();}catch(e){}
  if(!r.ok)throw new Error(j.error||('Errore '+r.status));
  return j;
}
async function check(){
  _pin=$('pin').value.trim();
  if(!/^\d{4,6}$/.test(_pin)){msg('Inserisci il PIN (4-6 cifre)');return;}
  msg('');$('go').disabled=true;
  try{
    var j=await call('check');
    _next=j.next;
    $('who').textContent='Ciao '+j.name;
    var since=j.since?new Date(j.since).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}):'';
    $('state').textContent=j.next==='uscita'?('In servizio dalle '+since):(j.stale?'Uscita precedente non registrata':'Non risulti in servizio');
    var b=$('punch');b.textContent=j.next==='uscita'?'Registra USCITA':'Registra ENTRATA';b.className=j.next;
    $('sub').textContent='Conferma la timbratura';
    show('s-conf');
  }catch(e){msg(e.message);$('pin').value='';}
  $('go').disabled=false;
}
async function punch(){
  $('punch').disabled=true;msg('');
  try{
    var j=await call('punch');
    var t=new Date(j.ts).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
    $('doneIcon').textContent=j.tipo==='entrata'?'✓':'👋';
    $('doneName').textContent=j.name;
    $('doneTxt').textContent=(j.tipo==='entrata'?'Entrata registrata alle ':'Uscita registrata alle ')+t+(j.duplicate?' (già registrata)':'');
    $('sub').textContent='';
    show('s-done');
    _timer=setTimeout(reset,10000);
  }catch(e){msg(e.message);}
  $('punch').disabled=false;
}
function reset(){
  clearTimeout(_timer);_pin='';$('pin').value='';msg('');
  $('sub').textContent='Inserisci il tuo PIN personale';
  show('s-pin');
}
$('pin').addEventListener('keydown',function(e){if(e.key==='Enter')check();});
</script>
</body>
</html>
