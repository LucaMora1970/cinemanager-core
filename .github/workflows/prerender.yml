name: Prerender pubblico

# Rigenera gli snapshot statici delle pagine pubbliche (home, lavora-con-noi,
# scheda film, giornata evento) con i contenuti reali già dentro l'HTML —
# vedi tools/prerender/generate.mjs. Solo schedule +
# workflow_dispatch: MAI su push, altrimenti il commit del bot
# ritriggererebbe se stesso in loop.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: prerender
  cancel-in-progress: false

jobs:
  prerender:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installa le dipendenze del generatore
        working-directory: tools/prerender
        run: npm install

      - name: Installa Chromium (Playwright)
        working-directory: tools/prerender
        run: npx playwright install --with-deps chromium

      - name: Genera gli snapshot
        working-directory: tools/prerender
        run: node generate.mjs

      - name: Commit e push se qualcosa è cambiato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html lavora-con-noi.html 'film-*.html' 'evento-giorno-*.html' sitemap.xml
          if git diff --cached --quiet; then
            echo "Nessuna modifica, salto il commit."
          else
            git commit -m "chore: aggiorna snapshot statico pubblico"
            git push
          fi
